name: Aplicar hotfix da busca dos filtros do Manejo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aplicar-hotfix-busca-filtro-manejo.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar versão web
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          antiga = "2026-07-30-modo-web-sem-pwa-15"
          nova = "2026-07-30-busca-filtros-manejo-16"

          for nome in ["index.html", "corponu-atualizador.js"]:
              caminho = Path(nome)
              texto = caminho.read_text(encoding="utf-8")
              if antiga in texto:
                  texto = texto.replace(antiga, nova)
              caminho.write_text(texto, encoding="utf-8")

          release = {
              "version": nova,
              "updatedAt": "2026-07-30T11:58:00-03:00",
              "notes": "Corrige a pesquisa dentro dos filtros acumulativos do Manejo. As opções agora desaparecem e reaparecem imediatamente conforme o texto digitado, inclusive ignorando diferenças de acentuação."
          }
          Path("corponu-release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Validar arquivos
        shell: bash
        run: |
          node --check corponu-atualizador.js
          node --check corponu-necessidade-livre.js
          python -m json.tool corponu-release.json > /dev/null
          grep -q "2026-07-30-busca-filtros-manejo-16" index.html
          grep -q "filtro-excel-opcao\[hidden\]" corponu-necessidade-livre.js
          git diff --check

      - name: Publicar correção
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Arquivos já sincronizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html corponu-atualizador.js corponu-release.json
          git commit -m "release: corrigir pesquisa nos filtros do manejo"
          git push origin main
