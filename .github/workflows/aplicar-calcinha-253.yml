name: Aplicar e testar Calcinha 253

on:
  push:
    branches:
      - fix/manejo-calcinha-filtros-253
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar-testar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: fix/manejo-calcinha-filtros-253

      - name: Aplicar refatoração 253
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/aplicar-calcinha-253.py')
          s = p.read_text(encoding='utf-8')
          antigo = '''calc_trocar(
    '        necessidade: dados.necessidade,\\n        necessidadeTexto: dados.necessidade,',
    '        fase: dados.fase,\\n        necessidade: dados.necessidade,\\n        necessidadeTexto: dados.necessidade,',
    'fase raiz Firestore',
)
calc_trocar(
    '        linhaCalcinhaLabel: linhaLabel,\\n        necessidade: dados.necessidade,',
    '        linhaCalcinhaLabel: linhaLabel,\\n        fase: dados.fase,\\n        necessidade: dados.necessidade,',
    'fase raiz mapa local',
)
'''
          novo = '''calc_trocar(
    '        necessidade: dados.necessidade,\\n        necessidadeTexto: dados.necessidade,',
    '        fase: dados.fase,\\n        necessidade: dados.necessidade,\\n        necessidadeTexto: dados.necessidade,',
    'fase raiz Firestore e mapa local',
    quantidade=2,
)
'''
          if s.count(antigo) != 1:
              raise SystemExit(f'Bloco de fase esperado não encontrado uma vez: {s.count(antigo)}')
          p.write_text(s.replace(antigo, novo, 1), encoding='utf-8')
          PY
          python3 .github/scripts/aplicar-calcinha-253.py
          git checkout -- .github/scripts/aplicar-calcinha-253.py

      - name: Validar sintaxe e arquitetura
        shell: bash
        run: |
          set -euo pipefail
          node --check corponu-manejo-calcinha-dedicado-253.js
          node --check corponu-dual-mode.js
          node --check corponu-atualizador.js
          node --check corponu-dual-ready-bridge.js
          python3 -m json.tool corponu-release.json >/dev/null

          grep -F 'corponu-dual-mode.js' corponu-atualizador.js
          grep -F 'corponu-manejo-calcinha-dedicado-253.js' corponu-atualizador.js
          ! grep -F 'corponu-calcinha-planejamento-opcional-129.js' corponu-atualizador.js
          ! grep -F 'corponu-manejo-calcinha-dedicado-252.js' corponu-atualizador.js

          grep -F 'const fasesSelecionadas = new Set();' corponu-manejo-calcinha-dedicado-253.js
          grep -F 'data-filtro-fase=' corponu-manejo-calcinha-dedicado-253.js
          grep -F 'f.fases.includes(normalizar(v.fase))' corponu-manejo-calcinha-dedicado-253.js
          ! grep -F 'Destino ainda não definido' corponu-manejo-calcinha-dedicado-253.js
          ! grep -F 'Sem facção planejada' corponu-manejo-calcinha-dedicado-253.js
          ! grep -F 'sincronizarLinhaOculta' corponu-manejo-calcinha-dedicado-253.js

          grep -F 'const choice = await chooseHistoricalPantyDestination(order, process);' corponu-dual-mode.js
          grep -F 'origemEnvio: "escolha_no_envio"' corponu-dual-mode.js
          ! grep -F 'Esta nova OP não possui serviço/facção planejados' corponu-dual-mode.js
          ! grep -F 'Selecione o serviço e a facção planejada.' corponu-dual-mode.js

      - name: Testar filtro acumulativo e envio sem facção planejada
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/corponu253
          cd /tmp/corponu253
          npm init -y >/dev/null 2>&1
          npm install --silent jsdom@24 >/dev/null 2>&1
          cat > teste.mjs <<'NODE'
          import { JSDOM } from 'jsdom';
          import fs from 'node:fs';

          const codigo = fs.readFileSync(process.env.GITHUB_WORKSPACE + '/corponu-manejo-calcinha-dedicado-253.js', 'utf8');
          const dom = new JSDOM(`<!doctype html><html><head></head><body>
            <div id="appShell">
              <section id="manejo" class="page active">
                <button class="manejo-setor-btn active" data-setor="calcinha">Calcinha</button>
                <datalist id="manejoFasesList"><option value="CORTE"></option><option value="COSTURA"></option><option value="ACABAMENTO"></option></datalist>
                <div class="table-wrap"><table class="manejo-inline-table"><tbody id="listaManejoInline"></tbody></table></div>
              </section>
            </div>
          </body></html>`, { runScripts: 'outside-only', url: 'https://teste.local/' });

          const { window } = dom;
          window.requestAnimationFrame = cb => setTimeout(() => cb(Date.now()), 0);
          window.cancelAnimationFrame = id => clearTimeout(id);
          if (!window.CSS) window.CSS = {};
          if (!window.CSS.escape) window.CSS.escape = value => String(value).replace(/[^a-zA-Z0-9_-]/g, ch => '\\' + ch);

          const ordens = new Map([
            ['1', { id:'1', numeroOP:'1001', referencia:'900', cor:'PRETO', quantidade:100, tipoPeca:'calcinha', linhaCalcinha:'cotton_line', necessidade:'URGENTE', manejosSetores:{calcinha:{fase:'COSTURA', linhaCalcinha:'cotton_line', status:'organizada'}} }],
            ['2', { id:'2', numeroOP:'1002', referencia:'901', cor:'BRANCO', quantidade:200, tipoPeca:'calcinha', linhaCalcinha:'corpo_nu', necessidade:'AMANHÃ', manejosSetores:{calcinha:{fase:'ACABAMENTO', linhaCalcinha:'corpo_nu', status:'organizada'}} }],
            ['3', { id:'3', numeroOP:'1003', referencia:'902', cor:'AZUL', quantidade:300, tipoPeca:'calcinha', linhaCalcinha:'cotton_line', necessidade:'NORMAL', manejosSetores:{calcinha:{fase:'CORTE', linhaCalcinha:'cotton_line', status:'organizada'}} }]
          ]);

          let envios = 0;
          const state = {
            ready: true,
            db: {},
            auth: { currentUser: { uid: 'teste-user' } },
            firebase: {
              doc: (...args) => args.join('/'),
              updateDoc: async () => {},
              serverTimestamp: () => 'SERVER_TIMESTAMP'
            },
            maps: { ordens, movimentacoes: new Map(), faccoes: new Map() }
          };
          window.corponuDualMode = { state, refresh: async () => state.maps };
          window.mandarParaFaccao = async id => { envios += 1; return id; };

          window.eval(codigo);
          await new Promise(r => setTimeout(r, 60));

          const root = window.document.getElementById('corponuManejoCalcinhaDedicado252');
          if (!root) throw new Error('Tela dedicada não foi criada.');
          if (/Destino ainda não definido|Sem facção planejada/.test(root.textContent)) throw new Error('Aviso antigo de facção ainda aparece.');
          if (root.querySelectorAll('[data-cn252-op]').length !== 3) throw new Error('Esperava 3 OPs antes dos filtros.');

          function checkboxDaFase(nome) {
            return [...root.querySelectorAll('[data-filtro-fase]')].find(el => el.parentElement?.textContent?.trim() === nome);
          }

          let cb = checkboxDaFase('COSTURA');
          if (!cb) throw new Error('Fase COSTURA não apareceu no filtro.');
          cb.checked = true;
          cb.dispatchEvent(new window.Event('change', { bubbles:true }));
          await new Promise(r => setTimeout(r, 30));

          cb = checkboxDaFase('ACABAMENTO');
          if (!cb) throw new Error('Fase ACABAMENTO não apareceu no filtro.');
          cb.checked = true;
          cb.dispatchEvent(new window.Event('change', { bubbles:true }));
          await new Promise(r => setTimeout(r, 30));

          let cards = [...root.querySelectorAll('[data-cn252-op]')];
          const opsDuasFases = cards.map(card => card.querySelector('.cn252-ident strong')?.textContent?.trim()).sort();
          if (cards.length !== 2 || !opsDuasFases.includes('OP 1001') || !opsDuasFases.includes('OP 1002')) {
            throw new Error('Filtro de duas fases não retornou COSTURA + ACABAMENTO corretamente: ' + JSON.stringify(opsDuasFases));
          }

          const linha = root.querySelector('#cn252FiltroLinha');
          linha.value = 'cotton_line';
          linha.dispatchEvent(new window.Event('change', { bubbles:true }));
          await new Promise(r => setTimeout(r, 30));
          cards = [...root.querySelectorAll('[data-cn252-op]')];
          if (cards.length !== 1 || !cards[0].textContent.includes('OP 1001')) {
            throw new Error('Acúmulo Fases + Linha não funcionou como E entre filtros.');
          }

          const enviar = cards[0].querySelector('[data-acao="enviar"]');
          enviar.click();
          await new Promise(r => setTimeout(r, 50));
          if (envios !== 1) throw new Error('OP sem facção planejada foi bloqueada antes do envio.');

          console.log('OK: duas fases acumuladas, Linha combinada e envio sem facção planejada funcionando.');
          NODE
          node teste.mjs

      - name: Conferir somente arquivos de produção esperados
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          permitidos = {
            'corponu-atualizador.js',
            'corponu-dual-mode.js',
            'corponu-manejo-calcinha-dedicado-253.js',
            'corponu-release.json',
          }
          linhas = subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()
          nomes = {linha[3:] for linha in linhas if len(linha) >= 4}
          extras = nomes - permitidos
          if extras:
              raise SystemExit(f'Arquivos inesperados alterados: {sorted(extras)}')
          faltando = permitidos - nomes
          if faltando:
              raise SystemExit(f'Arquivos esperados não alterados: {sorted(faltando)}')
          print('Diff de produção restrito aos 4 arquivos esperados.')
          PY

      - name: Commitar versão validada na branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corponu-atualizador.js corponu-dual-mode.js corponu-manejo-calcinha-dedicado-253.js corponu-release.json
          git commit -m 'refactor: Calcinha 253 com facção livre e filtros acumulativos'
          git push origin HEAD:fix/manejo-calcinha-filtros-253
