name: Diagnosticar painel Processos Faccoes 255

on:
  push:
    branches:
      - cleanup/faccoes-processos-painel-255
    paths:
      - .github/workflows/remover-painel-processos-faccoes-255.yml

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/faccoes-processos-painel-255
          fetch-depth: 0

      - name: Localizar fonte do painel
        run: |
          echo '=== TEXTO EXATO ==='
          grep -RniI --exclude-dir=.git --exclude='remover-painel-processos-faccoes-255.yml' 'Processos das facções' . || true
          echo '=== SUBTITULO ==='
          grep -RniI --exclude-dir=.git --exclude='remover-painel-processos-faccoes-255.yml' 'Clique em um processo' . || true
          echo '=== QUEM REALIZA ==='
          grep -RniI --exclude-dir=.git --exclude='remover-painel-processos-faccoes-255.yml' 'Quem realiza este processo' . || true
          echo '=== VARIANTES / IDS ==='
          grep -RniI --exclude-dir=.git --exclude='remover-painel-processos-faccoes-255.yml' -E 'processos.*fac(c|ç)(o|õ)es|fac(c|ç)(o|õ)es.*processos|gerenciamento fica em' . | head -200 || true
