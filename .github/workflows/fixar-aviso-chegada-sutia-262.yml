name: Aplicar aviso chegada Sutiã 262

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fixar-aviso-chegada-nativo-262.js'
      - '.github/workflows/fixar-aviso-chegada-sutia-262.yml'

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aplicar correção estrutural
        run: node scripts/fixar-aviso-chegada-nativo-262.js

      - name: Validar JavaScript
        run: |
          node --check app.js
          node --check corponu-faccoes-tres-abas-saida.js
          node --check corponu-aviso-chegada-admin-130.js
          node --check update.js
          node --check corponu-atualizador.js

      - name: Validar JSON e pós-condições
        run: |
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"
          grep -q 'function htmlChegadaAvisadaSutiaFaccoes' app.js
          grep -q 'chegada-avisada-sutia' app.js
          grep -q 'x.p.dataset.faccaoAbaAtiva = a' corponu-faccoes-tres-abas-saida.js
          grep -q 'faccoes-aviso-chegada-sutia-262' corponu-atualizador.js
          git diff --check

      - name: Gravar alteração
        run: |
          git config user.name "99eliel"
          git config user.email "131190282+99eliel@users.noreply.github.com"
          git add app.js corponu-faccoes-tres-abas-saida.js corponu-aviso-chegada-admin-130.js index.html update.js corponu-atualizador.js corponu-release.json version.json
          git diff --cached --quiet && { echo 'Nenhuma alteração para gravar'; exit 1; }
          git commit -m "fix: estabilizar chegada avisada somente no Sutiã 262"
          git push
