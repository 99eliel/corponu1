name: Publicar Fase Bojo oficial 289

on:
  push:
    paths:
      - '.github/workflows/publicar-fase-bojo-oficial-289.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar correção estrutural
        run: node scripts/publicar-fase-bojo-oficial-289.js

      - name: Validar JavaScript, JSON e invariantes
        run: |
          node --check update.js
          node --check corponu-atualizador.js
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"
          grep -F '2026-09-09-fase-bojo-oficial-289' index.html
          grep -F '2026-09-09-fase-bojo-oficial-289' update.js
          grep -F '2026-09-09-fase-bojo-oficial-289' corponu-atualizador.js
          grep -F 'Object.freeze(["BÁSICO SEM BOJO", "COM BOJO"])' update.js
          grep -F 'faseBojoOficial20260909V1' update.js
          grep -F 'await migrarFaseBojoOficialSeNecessario();' update.js
          grep -F 'restaurarOpcoesAntigasFases({ manual: true })' update.js
          ! grep -F 'restauracaoFasesAntigasAutomaticaTentada' update.js
          ! grep -F 'restaurarOpcoesAntigasFases({ manual: false })' update.js
          ! grep -F 'servicePaymentHold' index.html
          ! grep -F 'data-service-hold="payment"' index.html
          git diff --check

      - name: Garantir escopo exato
        run: |
          arquivos="$(git diff --name-only | sort)"
          esperado="$(printf '%s\n' corponu-atualizador.js corponu-release.json index.html update.js version.json | sort)"
          test "$arquivos" = "$esperado"

      - name: Publicar release 289
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corponu-atualizador.js corponu-release.json index.html update.js version.json
          git commit -m 'fix: consolidar Fase Bojo oficial release 289'
          git push origin HEAD:main
