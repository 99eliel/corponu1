name: Testar regras fases 291

on:
  push:
    paths:
      - '.github/workflows/testar-regras-fases-291.yml'

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar testes isolados
        run: |
          mkdir -p /tmp/corponu-rules-test
          cd /tmp/corponu-rules-test
          npm init -y >/dev/null 2>&1
          npm install --silent firebase@10.12.5 @firebase/rules-unit-testing@3.0.2
          cp "$GITHUB_WORKSPACE/firebase-rules.txt" ./firebase-rules.txt
          cat > test.mjs <<'EOF'
          import fs from 'node:fs';
          import {
            initializeTestEnvironment,
            assertSucceeds,
            assertFails
          } from '@firebase/rules-unit-testing';
          import {
            doc,
            setDoc,
            updateDoc
          } from 'firebase/firestore';

          const projectId = 'demo-corponu-rules-291';
          const rules = fs.readFileSync('./firebase-rules.txt', 'utf8');
          const env = await initializeTestEnvironment({
            projectId,
            firestore: { rules }
          });

          try {
            await env.withSecurityRulesDisabled(async context => {
              const db = context.firestore();
              await setDoc(doc(db, 'usuarios', 'usuario1'), { ativo: true, tipo: 'usuario' });
              await setDoc(doc(db, 'usuarios', 'admin1'), { ativo: true, tipo: 'admin' });
              await setDoc(doc(db, 'configuracoes', 'fasesManejo'), {
                sugestoes: ['CORTE', 'MONTAGEM', 'REVISÃO']
              });
              await setDoc(doc(db, 'configuracoes', 'fasesManejoCalcinha'), {
                sugestoes: ['COSTURA', 'ACABAMENTO']
              });
              await setDoc(doc(db, 'ordensProducao', 'op-legada'), {
                numeroOP: 'LEGADA',
                observacoes: 'original',
                manejosSetores: {
                  sutia: { fase: 'FASE ANTIGA', tecido: 'A' },
                  calcinha: { fase: 'FASE ANTIGA CALCINHA', tecido: 'B' }
                }
              });
            });

            const usuarioDb = env.authenticatedContext('usuario1').firestore();
            const adminDb = env.authenticatedContext('admin1').firestore();
            const opUsuario = doc(usuarioDb, 'ordensProducao', 'op-legada');

            // OP legada continua editável quando a fase não muda.
            await assertSucceeds(updateDoc(opUsuario, { observacoes: 'editada sem mexer na fase' }));

            // Sutiã: somente fase da lista oficial.
            await assertSucceeds(updateDoc(opUsuario, { 'manejosSetores.sutia.fase': 'CORTE' }));
            await assertFails(updateDoc(opUsuario, { 'manejosSetores.sutia.fase': 'INVENTADA' }));

            // Calcinha: lista própria e independente.
            await assertSucceeds(updateDoc(opUsuario, { 'manejosSetores.calcinha.fase': 'COSTURA' }));
            await assertFails(updateDoc(opUsuario, { 'manejosSetores.calcinha.fase': 'INVENTADA CALCINHA' }));
            await assertFails(updateDoc(opUsuario, { 'manejosSetores.calcinha.fase': 'CORTE' }));

            // Criação de OP pode existir sem fase, mas se vier fase precisa ser oficial.
            await assertSucceeds(setDoc(doc(usuarioDb, 'ordensProducao', 'op-sem-fase'), {
              numeroOP: 'SEM-FASE'
            }));
            await assertSucceeds(setDoc(doc(usuarioDb, 'ordensProducao', 'op-valida'), {
              numeroOP: 'VALIDA',
              manejosSetores: { sutia: { fase: 'MONTAGEM' } }
            }));
            await assertFails(setDoc(doc(usuarioDb, 'ordensProducao', 'op-invalida'), {
              numeroOP: 'INVALIDA',
              manejosSetores: { sutia: { fase: 'QUALQUER COISA' } }
            }));

            // Usuário comum não cria mais fase pela coleção legada.
            await assertFails(setDoc(doc(usuarioDb, 'fasesManejo', 'inventada'), { nome: 'INVENTADA' }));

            // Usuário comum também não altera a configuração oficial.
            await assertFails(updateDoc(doc(usuarioDb, 'configuracoes', 'fasesManejo'), {
              sugestoes: ['INVENTADA']
            }));

            // Admin continua com controle total e pode fazer manutenção excepcional.
            await assertSucceeds(updateDoc(doc(adminDb, 'ordensProducao', 'op-legada'), {
              'manejosSetores.sutia.fase': 'AJUSTE ADMINISTRATIVO'
            }));
            await assertSucceeds(setDoc(doc(adminDb, 'fasesManejo', 'admin'), { nome: 'ADMIN' }));

            console.log('TODOS_OS_TESTES_DE_REGRAS_291_PASSARAM');
          } finally {
            await env.cleanup();
          }
          EOF

      - name: Executar testes contra Firestore Emulator
        run: |
          npx --yes firebase-tools@14.17.0 emulators:exec --only firestore --project demo-corponu-rules-291 "cd /tmp/corponu-rules-test && node test.mjs"
