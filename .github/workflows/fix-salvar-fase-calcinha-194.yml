name: Fix salvar fase Calcinha 194

on:
  push:
    paths:
      - '.trigger-salvar-fase-calcinha-194'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir sobrescrita da fase da Calcinha
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('corponu-dual-mode.js')
          text = p.read_text(encoding='utf-8')
          old = '''  async function saveCalcinhaLine(orderId, value) {
    if (!orderId) return;
    const user = currentUser();
    const { doc, setDoc, serverTimestamp } = state.firebase;
    const normalized = lineValue(value);
    const current = state.maps.ordens.get(orderId) || {};
    const managementCurrent = current?.manejosSetores?.calcinha || {};
    await setDoc(doc(state.db, "ordensProducao", orderId), {
      tipoPeca: "calcinha",
      tipoPecaLabel: "Calcinha",
      linhaCalcinha: normalized,
      linhaCalcinhaLabel: lineLabel(normalized),
      manejosSetores: {
        ...(current.manejosSetores || {}),
        calcinha: {
          ...managementCurrent,
          linhaCalcinha: normalized,
          linhaCalcinhaLabel: lineLabel(normalized),
          atualizadoPor: user?.uid || "",
          atualizadoEm: serverTimestamp()
        }
      },
      atualizadoPor: user?.uid || "",
      atualizadoEm: serverTimestamp()
    }, { merge: true });
    state.maps.ordens.set(orderId, { ...current, id: orderId, tipoPeca: "calcinha", linhaCalcinha: normalized, linhaCalcinhaLabel: lineLabel(normalized) });
  }
'''
          new = '''  async function saveCalcinhaLine(orderId, value) {
    if (!orderId) return;
    const user = currentUser();
    const { doc, updateDoc, serverTimestamp } = state.firebase;
    const normalized = lineValue(value);
    const current = state.maps.ordens.get(orderId) || {};
    const managementCurrent = current?.manejosSetores?.calcinha || {};

    // Atualiza somente os campos da LINHA. O salvamento principal do Manejo acabou
    // de gravar FASE/NECESSIDADE e demais dados; reenviar o mapa calcinha inteiro
    // com o cache antigo restaurava a fase anterior (ex.: DEP. CORTE).
    await updateDoc(doc(state.db, "ordensProducao", orderId), {
      tipoPeca: "calcinha",
      tipoPecaLabel: "Calcinha",
      linhaCalcinha: normalized,
      linhaCalcinhaLabel: lineLabel(normalized),
      "manejosSetores.calcinha.linhaCalcinha": normalized,
      "manejosSetores.calcinha.linhaCalcinhaLabel": lineLabel(normalized),
      "manejosSetores.calcinha.atualizadoPor": user?.uid || "",
      "manejosSetores.calcinha.atualizadoEm": serverTimestamp(),
      atualizadoPor: user?.uid || "",
      atualizadoEm: serverTimestamp()
    });

    state.maps.ordens.set(orderId, {
      ...current,
      id: orderId,
      tipoPeca: "calcinha",
      linhaCalcinha: normalized,
      linhaCalcinhaLabel: lineLabel(normalized),
      manejosSetores: {
        ...(current.manejosSetores || {}),
        calcinha: {
          ...managementCurrent,
          linhaCalcinha: normalized,
          linhaCalcinhaLabel: lineLabel(normalized)
        }
      }
    });
  }
'''
          if old not in text:
              raise SystemExit('Trecho saveCalcinhaLine esperado nao encontrado; nenhuma alteracao aplicada.')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          release = {
            'version': '2026-08-13-fase-calcinha-nao-reverter-194',
            'updatedAt': '2026-08-13T09:12:00-03:00',
            'notes': 'Corrige exclusivamente o Manejo Calcinha: ao salvar a Linha, o modulo legado deixa de reenviar o mapa inteiro manejosSetores.calcinha com dados antigos. Agora atualiza somente Linha e metadados, preservando a nova Fase salva pelo Manejo. O Manejo Sutia nao e alterado.'
          }
          Path('corponu-release.json').write_text(json.dumps(release, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          node --check corponu-dual-mode.js
      - name: Publicar e limpar temporarios
        run: |
          rm -f .trigger-salvar-fase-calcinha-194
          rm -f .github/workflows/fix-salvar-fase-calcinha-194.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preservar fase ao salvar Linha da Calcinha 194 [skip ci]"
          git push origin HEAD:main
