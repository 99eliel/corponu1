name: Ocultar resumo processos faccoes 173
on:
  push:
    branches: [main]
    paths: ['.ocultar-resumo-processos-faccoes-173']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ocultar somente o resumo visual
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          modulo = r'''(() => {
  "use strict";

  const VERSION = "2026-08-11-ocultar-resumo-processos-faccoes-173";
  if (window.__CORPONU_OCULTAR_RESUMO_PROCESSOS_FACCOES__ === VERSION) return;
  window.__CORPONU_OCULTAR_RESUMO_PROCESSOS_FACCOES__ = VERSION;

  const normalizar = valor => String(valor || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ")
    .trim()
    .toUpperCase();

  function ocultarResumo() {
    const secao = document.getElementById("faccoes");
    if (!secao) return false;

    const titulo = [...secao.querySelectorAll("h1,h2,h3,h4,strong")]
      .find(el => normalizar(el.textContent) === "PROCESSOS DAS FACCOES");
    if (!titulo) return false;

    let alvo = titulo.parentElement;
    while (alvo && alvo !== secao) {
      const texto = normalizar(alvo.innerText || alvo.textContent);
      const botoes = alvo.querySelectorAll("button").length;
      if (texto.includes("PROCESSOS DAS FACCOES") &&
          texto.includes("CLIQUE EM UM PROCESSO") &&
          botoes >= 3) {
        if (alvo.dataset.corponuResumoProcessosOculto !== "1") {
          alvo.dataset.corponuResumoProcessosOculto = "1";
          alvo.hidden = true;
          alvo.style.setProperty("display", "none", "important");
          alvo.setAttribute("aria-hidden", "true");
        }
        return true;
      }
      alvo = alvo.parentElement;
    }
    return false;
  }

  let timer = 0;
  function agendar() {
    window.clearTimeout(timer);
    timer = window.setTimeout(ocultarResumo, 30);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", ocultarResumo, { once: true });
  } else {
    ocultarResumo();
  }

  const observer = new MutationObserver(agendar);
  const iniciarObserver = () => {
    const secao = document.getElementById("faccoes");
    if (secao) observer.observe(secao, { childList: true, subtree: true });
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciarObserver, { once: true });
  else iniciarObserver();

  document.addEventListener("click", event => {
    if (event.target?.closest?.('[data-page="faccoes"]')) {
      [0, 100, 350].forEach(ms => window.setTimeout(ocultarResumo, ms));
    }
  }, true);
})();
'''
          Path('corponu-faccoes-ocultar-resumo-processos-173.js').write_text(modulo, encoding='utf-8')

          p = Path('corponu-atualizador.js')
          s = p.read_text(encoding='utf-8')
          alvo = '    modulos.forEach(([arquivo, marcador, erro]) => carregarScript(arquivo, marcador, erro));'
          novo = alvo + '\n    carregarScript("corponu-faccoes-ocultar-resumo-processos-173.js", "faccoes-ocultar-resumo-processos-173", "Não foi possível ocultar o resumo visual de processos das facções.");'
          if 'corponu-faccoes-ocultar-resumo-processos-173.js' not in s:
              if alvo not in s: raise SystemExit('ponto de carga dos módulos não encontrado')
              s = s.replace(alvo, novo, 1)
          p.write_text(s, encoding='utf-8')

          Path('corponu-release.json').write_text(json.dumps({
            'version':'2026-08-11-faccoes-sem-resumo-processos-173',
            'updatedAt':'2026-08-11T09:51:00-03:00',
            'notes':'Remove somente da interface da aba Facções o painel redundante Processos das facções. Os vínculos entre facções e processos, filtros, saídas, chegadas e demais regras continuam intactos.'
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validar
        run: |
          node --check corponu-faccoes-ocultar-resumo-processos-173.js
          node --check corponu-atualizador.js
          grep -q 'PROCESSOS DAS FACCOES' corponu-faccoes-ocultar-resumo-processos-173.js
          grep -q 'corponu-faccoes-ocultar-resumo-processos-173.js' corponu-atualizador.js
      - name: Publicar
        run: |
          rm -f .ocultar-resumo-processos-faccoes-173 .github/workflows/ocultar-resumo-processos-faccoes-173.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'ui: remover resumo redundante de processos das facções 173 [skip ci]'
          git push
