name: Publicar saída fantasma 297

on:
  push:
    paths:
      - '.github/workflows/publicar-saida-fantasma-297.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirmar base 296
        run: |
          grep -F '"version": "2026-09-09-exclusao-faccoes-estavel-296"' version.json
          grep -F 'const V = "2026-09-04-faccoes-saida-controlada-285";' corponu-faccoes-tres-abas-saida.js

      - name: Trazer módulo validado do teste
        run: |
          curl -fsSL https://raw.githubusercontent.com/99eliel/corpunuteste/main/corponu-faccoes-tres-abas-saida.js -o corponu-faccoes-tres-abas-saida.js
          grep -F 'const V = "2026-09-09-saida-fantasma-canonica-297";' corponu-faccoes-tres-abas-saida.js
          grep -F 'function tipoDestinoCanonicoMovimentacao(mov)' corponu-faccoes-tres-abas-saida.js
          grep -F 'function localizarSaidaFaccaoEmAndamento(c, processoAtual)' corponu-faccoes-tres-abas-saida.js

      - name: Publicar release 297
        run: |
          node <<'NODE'
          const fs = require('fs');
          const antiga = '2026-09-09-exclusao-faccoes-estavel-296';
          const nova = '2026-09-09-saida-fantasma-canonica-297';
          const arquivosTexto = ['corponu-atualizador.js', 'index.html', 'update.js'];
          for (const arquivo of arquivosTexto) {
            let src = fs.readFileSync(arquivo, 'utf8');
            const ocorrencias = src.split(antiga).length - 1;
            if (!ocorrencias) throw new Error(`Versão antiga ausente em ${arquivo}`);
            src = src.split(antiga).join(nova);
            fs.writeFileSync(arquivo, src, 'utf8');
          }

          const notes = 'Produção. Corrigida a saída fantasma em Facções: a verificação de duplicidade agora considera somente movimentações realmente pertencentes a Facções. Registros de Célula, Corte, cancelados, retornados, concluídos, com chegada, incompletos ou de outro processo não bloqueiam uma nova saída. Registros antigos de Facção com tipo/aba inconsistentes são normalizados para o esquema canônico e voltam a aparecer na aba Facções antes de continuar bloqueando uma duplicidade real.';
          const agora = new Date().toISOString();
          for (const arquivo of ['version.json', 'corponu-release.json']) {
            const obj = JSON.parse(fs.readFileSync(arquivo, 'utf8'));
            if (obj.version !== antiga) throw new Error(`Base inesperada em ${arquivo}: ${obj.version}`);
            obj.version = nova;
            obj.updatedAt = agora;
            obj.notes = notes;
            fs.writeFileSync(arquivo, JSON.stringify(obj, null, 2) + '\n', 'utf8');
          }
          NODE

      - name: Validar sintaxe e invariantes
        run: |
          node --check corponu-faccoes-tres-abas-saida.js
          node --check corponu-atualizador.js
          node --check update.js
          grep -F 'const V = "2026-09-09-saida-fantasma-canonica-297";' corponu-faccoes-tres-abas-saida.js
          grep -F 'normalizadoSaidaFantasma297: true' corponu-faccoes-tres-abas-saida.js
          grep -F 'const conflito = await localizarSaidaFaccaoEmAndamento(c, processo);' corponu-faccoes-tres-abas-saida.js
          ! grep -F 'return !m.dataChegada && !m.cancelado && !m.excluido && norm(m.status) !== "CANCELADO" && norm(m.processo) === processo;' corponu-faccoes-tres-abas-saida.js
          grep -F '2026-09-09-saida-fantasma-canonica-297' corponu-atualizador.js
          grep -F '2026-09-09-saida-fantasma-canonica-297' version.json
          grep -F '2026-09-09-saida-fantasma-canonica-297' corponu-release.json
          grep -F '2026-09-09-saida-fantasma-canonica-297' index.html
          grep -F '2026-09-09-saida-fantasma-canonica-297' update.js
          git diff --check

      - name: Garantir escopo exato
        run: |
          arquivos="$(git diff --name-only | sort)"
          esperado="$(printf '%s\n' corponu-atualizador.js corponu-faccoes-tres-abas-saida.js corponu-release.json index.html update.js version.json | sort)"
          test "$arquivos" = "$esperado"
          test -z "$(git diff --name-only -- app.js)"

      - name: Commitar release 297
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corponu-atualizador.js corponu-faccoes-tres-abas-saida.js corponu-release.json index.html update.js version.json
          git commit -m 'fix: corrigir saída fantasma de Facções 297'
          git push origin HEAD:main
