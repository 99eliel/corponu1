name: Finalizar sem chegada manual Lateral e Alça 260

on:
  push:
    paths:
      - 'scripts/finalizar-sem-chegada-manual-lateral-alca-260.mjs'
      - '.github/workflows/finalizar-sem-chegada-manual-lateral-alca-260.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Remover Chegada manual de Lateral e Alça
        run: node scripts/finalizar-sem-chegada-manual-lateral-alca-260.mjs

      - name: Validar JavaScript e JSON
        run: |
          node --check app.js
          node --check update.js
          node --check corponu-atualizador.js
          node --check corponu-faccoes-lateral-alca-254.js
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); console.log('JSON OK')"

      - name: Confirmar fluxo completo
        shell: bash
        run: |
          ! grep -n -E 'btnChegadaManualLateralAlca|garantirProcessosChegadaManual|chegadaManualProcessoList|btnAbrirChegadaManualFaccao|formChegadaManualFaccao|chegadaManualOP' corponu-faccoes-lateral-alca-254.js
          grep -q 'id="btnCorteRegistrarSaida"' corponu-faccoes-lateral-alca-254.js
          grep -q 'id="formChegadaCorte"' corponu-faccoes-lateral-alca-254.js
          grep -q 'function abrirChegada(' corponu-faccoes-lateral-alca-254.js
          grep -q 'function salvarChegada(' corponu-faccoes-lateral-alca-254.js
          grep -q '2026-08-26-faccoes-sem-chegada-manual-260' corponu-atualizador.js
          grep -q 'update.js?v=2026-08-26-faccoes-sem-chegada-manual-260' index.html
          grep -q 'app.js?v=2026-08-26-faccoes-sem-chegada-manual-260' index.html
          test ! -e scripts/finalizar-sem-chegada-manual-lateral-alca-260.mjs
          test ! -e .github/workflows/finalizar-sem-chegada-manual-lateral-alca-260.yml

      - name: Gravar versão 260 final
        shell: bash
        run: |
          git config user.name "99eliel"
          git config user.email "131190282+99eliel@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remover chegada manual também de Lateral e Alça"
          git push
