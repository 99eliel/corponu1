name: Liberar fechamentos antigos Lateral e Alça 279

on:
  push:
    branches: [main]
    paths:
      - 'scripts/liberar-fechamentos-antigos-lateral-alca-279.js'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar alteração estrutural
        run: node scripts/liberar-fechamentos-antigos-lateral-alca-279.js
      - name: Validar JavaScript
        run: |
          node --check corponu-faccoes-lateral-alca-v2-270.js
          node --check update.js
          node --check corponu-atualizador.js
      - name: Validar JSON e pós-condições
        run: |
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"
          if grep -q 'Essa OP de Calcinha não possui alça cadastrada' corponu-faccoes-lateral-alca-v2-270.js; then echo 'Trava antiga ainda presente'; exit 1; fi
          grep -q 'const calcinha = Boolean(opSaida)' corponu-faccoes-lateral-alca-v2-270.js
          grep -q 'possuiAlcaOrigem: opPossuiAlca(opSaida)' corponu-faccoes-lateral-alca-v2-270.js
      - name: Commit funcional
        run: |
          if git diff --quiet; then echo 'Nenhuma alteração'; exit 1; fi
          git config user.name '99eliel'
          git config user.email '131190282+99eliel@users.noreply.github.com'
          git add corponu-faccoes-lateral-alca-v2-270.js corponu-release.json version.json update.js corponu-atualizador.js index.html
          git commit -m 'fix: permitir fechamentos antigos em Lateral e Alça 279'
          git push
