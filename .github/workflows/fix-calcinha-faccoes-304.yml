name: Validar Calcinha Facções 304

on:
  push:
    branches:
      - 'fix/calcinha-faccoes-304'
    paths:
      - '.github/workflows/fix-calcinha-faccoes-304.yml'

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/calcinha-faccoes-304

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar correção estrutural
        run: node scripts/fix-calcinha-faccoes-304.js

      - name: Validar sintaxe e estrutura
        shell: bash
        run: |
          set -euo pipefail
          node --check corponu-dual-mode.js
          node --check corponu-atualizador.js
          node --check update.js
          node -e "JSON.parse(require('fs').readFileSync('version.json','utf8')); JSON.parse(require('fs').readFileSync('corponu-release.json','utf8'));"
          grep -F "row.querySelector?.('[data-movimentacao-id]')?.dataset?.movimentacaoId" corponu-dual-mode.js
          ! grep -F 'const destination = normalize(row.cells[4]?.textContent || row.cells[3]?.textContent);' corponu-dual-mode.js
          grep -F '2026-09-09-calcinha-faccoes-id-oficial-304' version.json
          git diff --check

      - name: Garantir escopo exato
        shell: bash
        run: |
          set -euo pipefail
          arquivos="$(git diff --name-only | sort)"
          esperado="$(printf '%s\n' corponu-atualizador.js corponu-dual-mode.js corponu-release.json index.html update.js version.json | sort)"
          test "$arquivos" = "$esperado"

      - name: Commitar correção validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corponu-atualizador.js corponu-dual-mode.js corponu-release.json index.html update.js version.json
          git commit -m 'fix: restaurar linhas Calcinha em Faccoes 304'
          git push origin HEAD:fix/calcinha-faccoes-304
