name: Publicar menu ações Manejo 293

on:
  push:
    paths:
      - '.github/workflows/publicar-menu-acoes-manejo-293.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Aplicar correção validada no teste
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/99eliel/corpunuteste/9fea3eb996a4ca1026510f57e53c5ad06f06b2fd/scripts/corrigir-menu-acoes-manejo-293.py' -o /tmp/corrigir-menu-acoes-manejo-293.py
          python3 /tmp/corrigir-menu-acoes-manejo-293.py

      - name: Preparar release 293
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const OLD = '2026-09-09-fases-calcinha-limpas-292';
          const NEW = '2026-09-09-menu-acoes-manejo-293';
          const notes = 'Produção. Corrige estruturalmente o menu de três pontos do Manejo Sutiã: remove dependência de onclick inline/evento global, usa um único tratamento delegado, mantém o menu global ancorado ao botão e o reposiciona durante rolagem/redimensionamento em vez de fechá-lo. O posicionamento escolhe acima ou abaixo conforme o espaço disponível. Nenhuma OP, regra do Firebase, pagamento, Facção ou regra de negócio foi alterada.';

          for (const arquivo of ['index.html', 'corponu-atualizador.js', 'update.js']) {
            let texto = fs.readFileSync(arquivo, 'utf8');
            if (!texto.includes(OLD)) throw new Error(`${arquivo}: release 292 não encontrada`);
            texto = texto.split(OLD).join(NEW);
            fs.writeFileSync(arquivo, texto, 'utf8');
          }

          for (const arquivo of ['version.json', 'corponu-release.json']) {
            const obj = JSON.parse(fs.readFileSync(arquivo, 'utf8'));
            if (obj.version !== OLD) throw new Error(`${arquivo}: versão inesperada ${obj.version}`);
            obj.version = NEW;
            obj.updatedAt = '2026-09-09T11:05:00-03:00';
            obj.notes = notes;
            fs.writeFileSync(arquivo, JSON.stringify(obj, null, 2) + '\n', 'utf8');
          }
          NODE

      - name: Validar sintaxe e invariantes
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check update.js
          node --check corponu-atualizador.js
          node -e "JSON.parse(require('fs').readFileSync('version.json','utf8')); JSON.parse(require('fs').readFileSync('corponu-release.json','utf8'));"
          grep -F '2026-09-09-menu-acoes-manejo-293' index.html
          grep -F '2026-09-09-menu-acoes-manejo-293' update.js
          grep -F '2026-09-09-menu-acoes-manejo-293' corponu-atualizador.js
          grep -F 'data-manejo-acoes-id="${op.id}"' app.js
          grep -F 'function toggleMenuAcoesManejo(ordemId, botao)' app.js
          grep -F 'botaoAcoesManejo.dataset.manejoAcoesId' app.js
          grep -F 'menu.__botaoAncoraManejo = botao' app.js
          grep -F 'window.addEventListener("scroll", agendarReposicionamentoMenuAcoesManejo, true)' app.js
          ! grep -F 'onclick="toggleMenuAcoesManejo(event,' app.js
          ! grep -F 'window.addEventListener("scroll", fecharMenusAcoesManejo, true)' app.js
          grep -F 'projectId: "corponu-b4942"' app.js
          ! grep -F 'projectId: "corponuteste"' app.js
          git diff --check

      - name: Garantir escopo exato
        shell: bash
        run: |
          set -euo pipefail
          arquivos="$(git diff --name-only | sort)"
          esperado="$(printf '%s\n' app.js corponu-atualizador.js corponu-release.json index.html update.js version.json | sort)"
          test "$arquivos" = "$esperado"

      - name: Publicar release 293
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js corponu-atualizador.js corponu-release.json index.html update.js version.json
          git commit -m 'fix: corrigir menu de ações do Manejo Sutiã 293'
          git push origin HEAD:main
