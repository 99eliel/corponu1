name: Publicar recuperacao 288

on:
  push:
    paths:
      - '.github/workflows/publicar-recuperacao-288.yml'

permissions:
  contents: write

jobs:
  recuperar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar release limpa
        run: node scripts/publicar-recuperacao-288.js

      - name: Validar estrutura e versao
        run: |
          node --check corponu-atualizador.js
          node --check update.js
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"
          grep -F '2026-09-09-recuperacao-pre-bloqueio-288' index.html
          grep -F '2026-09-09-recuperacao-pre-bloqueio-288' corponu-atualizador.js
          grep -F '2026-09-09-recuperacao-pre-bloqueio-288' update.js
          ! grep -F 'servicePaymentHold' index.html
          ! grep -F 'data-service-hold="payment"' index.html
          git diff --check

      - name: Garantir escopo exato
        run: |
          arquivos="$(git diff --name-only | sort)"
          esperado="$(printf '%s\n' corponu-atualizador.js corponu-release.json index.html update.js version.json | sort)"
          test "$arquivos" = "$esperado"

      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corponu-atualizador.js corponu-release.json index.html update.js version.json
          git commit -m 'fix: publicar recuperacao exata pre-bloqueio release 288'
          git push origin HEAD:main
