name: Aplicar Fix Event Loop 248

on:
  push:
    branches:
      - fix/pagamentos-eventloop-248
    paths:
      - .github/workflows/aplicar-fix-eventloop-248.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: fix/pagamentos-eventloop-248
          fetch-depth: 0

      - name: Remover observer autoalimentado
        shell: python
        run: |
          from pathlib import Path

          arquivo = Path('update.js')
          texto = arquivo.read_text(encoding='utf-8')
          assinatura = 'function instalarObserverTabelaPagamentoFinal()'

          if texto.count(assinatura) != 1:
            raise SystemExit(f'Esperava exatamente 1 função {assinatura!r}, encontrei {texto.count(assinatura)}. Nenhuma alteração feita.')

          inicio = texto.index(assinatura)
          abre = texto.index('{', inicio)
          nivel = 0
          fim = None
          quote = None
          escape = False

          for pos in range(abre, len(texto)):
            ch = texto[pos]
            if escape:
              escape = False
              continue
            if ch == '\\':
              escape = True
              continue
            if quote:
              if ch == quote:
                quote = None
              continue
            if ch in ('"', "'", '`'):
              quote = ch
              continue
            if ch == '{':
              nivel += 1
            elif ch == '}':
              nivel -= 1
              if nivel == 0:
                fim = pos + 1
                break

          if fim is None:
            raise SystemExit('Não foi possível localizar o fechamento da função. Nenhuma alteração feita.')

          bloco = texto[inicio:fim]
          marcadores = [
            'listaEntregasPagamento',
            'new MutationObserver',
            'queueMicrotask',
            'observerTabelaPagamentoFinal.observe'
          ]

          if 'v248: desativado' in bloco:
            print('PATCH_248_JA_APLICADO')
          else:
            faltando = [item for item in marcadores if item not in bloco]
            if faltando:
              raise SystemExit(f'A função encontrada não corresponde ao observer esperado. Marcadores ausentes: {faltando}')

            linha_inicio = texto.rfind('\n', 0, inicio) + 1
            indent = texto[linha_inicio:inicio]
            interno = indent + '  '
            novo = (
              'function instalarObserverTabelaPagamentoFinal() {\n'
              f'{interno}// v248: desativado. O observer antigo observava childList+subtree desta\n'
              f'{interno}// tabela e o próprio callback alterava textContent/innerHTML dentro dela,\n'
              f'{interno}// gerando novas mutações em ciclo e congelando o navegador.\n'
              f'{interno}if (observerTabelaPagamentoFinal) observerTabelaPagamentoFinal.disconnect();\n'
              f'{interno}observerTabelaPagamentoFinal = null;\n'
              f'{indent}}}'
            )
            texto = texto[:inicio] + novo + texto[fim:]
            arquivo.write_text(texto, encoding='utf-8')
            print('PATCH_248_APLICADO_EXATAMENTE_NA_FUNCAO')

      - name: Validar patch
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < update.js
          grep -F 'v248: desativado' update.js
          if grep -F 'observerTabelaPagamentoFinal.observe(tbody, { childList: true, subtree: true });' update.js; then
            echo 'Observer legado ainda presente' >&2
            exit 1
          fi

      - name: Commitar patch na branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- update.js; then
            echo 'Nenhuma alteração pendente.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.js
          git commit -m 'fix: remover loop do observer de Pagamentos 248'
          git push origin HEAD:fix/pagamentos-eventloop-248
