name: Aplicar Fix Event Loop 248

on:
  push:
    branches:
      - fix/pagamentos-eventloop-248
    paths:
      - .github/workflows/aplicar-fix-eventloop-248.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: fix/pagamentos-eventloop-248
          fetch-depth: 0
      - name: Remover observer autoalimentado
        shell: python
        run: |
          from pathlib import Path

          arquivo = Path('update.js')
          texto = arquivo.read_text(encoding='utf-8')

          antigo = '''  function instalarObserverTabelaPagamentoFinal() {
            const tbody = document.getElementById("listaEntregasPagamento");
            if (!tbody) {
              setTimeout(instalarObserverTabelaPagamentoFinal, 400);
              return;
            }
            if (observerTabelaPagamentoFinal) observerTabelaPagamentoFinal.disconnect();
            observerTabelaPagamentoFinal = new MutationObserver(() => {
              queueMicrotask(() => aprimorarTabelaEntregasPagamentoFinal());
            });
            observerTabelaPagamentoFinal.observe(tbody, { childList: true, subtree: true });
          }'''

          novo = '''  function instalarObserverTabelaPagamentoFinal() {
            // v248: desativado. O observer antigo observava childList+subtree desta
            // tabela e o próprio callback alterava textContent/innerHTML dentro dela,
            // gerando novas mutações em ciclo e congelando o navegador.
            if (observerTabelaPagamentoFinal) observerTabelaPagamentoFinal.disconnect();
            observerTabelaPagamentoFinal = null;
          }'''

          if novo in texto:
            print('PATCH_248_JA_APLICADO')
          else:
            ocorrencias = texto.count(antigo)
            if ocorrencias != 1:
              raise SystemExit(f'Esperava exatamente 1 bloco legado, encontrei {ocorrencias}. Nenhuma alteração feita.')
            texto = texto.replace(antigo, novo, 1)
            arquivo.write_text(texto, encoding='utf-8')
            print('PATCH_248_APLICADO_EXATAMENTE_UMA_VEZ')
      - name: Validar patch
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < update.js
          grep -F 'v248: desativado' update.js
          if grep -F 'observerTabelaPagamentoFinal.observe(tbody, { childList: true, subtree: true });' update.js; then
            echo 'Observer legado ainda presente' >&2
            exit 1
          fi
      - name: Commitar patch na branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- update.js; then
            echo 'Nenhuma alteração pendente.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.js
          git commit -m 'fix: remover loop do observer de Pagamentos 248'
          git push origin HEAD:fix/pagamentos-eventloop-248
