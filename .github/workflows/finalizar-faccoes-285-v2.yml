name: Finalizar Facções 285 v2

on:
  push:
    paths:
      - '.github/workflows/finalizar-faccoes-285-v2.yml'

permissions:
  contents: write

jobs:
  finalizar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Aplicar finalização estrutural
        run: python scripts/finalizar-faccoes-285-v2.py

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < corponu-dual-mode.js
          node --input-type=module --check < corponu-faccoes-tres-abas-saida.js
          node --input-type=module --check < corponu-faccoes-lateral-alca-v2-270.js

      - name: Validar arquitetura final
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const listaAtiva = gerais.filter' corponu-dual-mode.js
          ! grep -F 'movementCounts(activeType)' corponu-dual-mode.js
          ! grep -F 'stopImmediatePropagation()' corponu-faccoes-tres-abas-saida.js
          ! grep -F 'abaFaccaoCorte' corponu-faccoes-tres-abas-saida.js
          ! grep -F 'preferencia === "corte"' corponu-faccoes-tres-abas-saida.js
          ! grep -F 'aba === "corte"' corponu-faccoes-tres-abas-saida.js
          grep -F '2026-09-04-faccoes-controlador-unificado-285' corponu-release.json

      - name: Conferir diff
        run: git diff --check

      - name: Commitar alterações
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corponu-dual-mode.js corponu-faccoes-tres-abas-saida.js
          git diff --cached --quiet && { echo 'Nenhuma alteração para commit.'; exit 1; }
          git commit -m 'refactor: concluir organização estrutural de Facções 285'
          git push origin HEAD:main
