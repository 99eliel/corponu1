name: Publicar chegada Sutiã 301

on:
  push:
    paths:
      - '.github/workflows/publicar-chegada-sutia-301.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar correção estrutural
        run: node scripts/publicar-chegada-sutia-301.js

      - name: Validar JavaScript e versionamento
        shell: bash
        run: |
          set -euo pipefail
          node --check corponu-sutia-completo-calculo-base-174.js
          node --check corponu-atualizador.js
          node --check update.js
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"
          grep -F '[data-faccoes-acao="chegada"][data-movimentacao-id]' corponu-sutia-completo-calculo-base-174.js
          grep -F '[onclick*="registrarChegadaMovimentacao"]' corponu-sutia-completo-calculo-base-174.js
          grep -F '2026-09-09-sutia-completo-chegada-controlador-301' version.json
          grep -F '2026-09-09-sutia-completo-chegada-controlador-301' corponu-release.json
          git diff --check

      - name: Garantir escopo
        shell: bash
        run: |
          set -euo pipefail
          arquivos="$(git diff --name-only | sort)"
          esperado="$(printf '%s\n' corponu-atualizador.js corponu-release.json corponu-sutia-completo-calculo-base-174.js index.html update.js version.json | sort)"
          test "$arquivos" = "$esperado"

      - name: Publicar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corponu-atualizador.js corponu-release.json corponu-sutia-completo-calculo-base-174.js index.html update.js version.json
          git commit -m 'fix: integrar chegada do Sutiã Completo ao controlador 301'
          git push origin HEAD:main
