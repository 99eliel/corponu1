name: Corrigir Registrar Saida Faccoes 283

on:
  push:
    paths:
      - '.github/workflows/corrigir-registrar-saida-faccoes-283.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar correcao estrutural
        run: node scripts/corrigir-registrar-saida-faccoes-283.js

      - name: Validar JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < corponu-faccoes-tres-abas-saida.js
          node --input-type=module --check < corponu-atualizador.js
          node --input-type=module --check < update.js

      - name: Validar JSON e pos-condicoes
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"
          grep -F 'b.id = "btnSaidaAbas";' corponu-faccoes-tres-abas-saida.js
          grep -F 'b.textContent = "Registrar saída";' corponu-faccoes-tres-abas-saida.js
          grep -F 'if (!x) return;' corponu-faccoes-tres-abas-saida.js
          ! grep -F 'if (!x || !document.getElementById("abaFaccaoCorte")) return;' corponu-faccoes-tres-abas-saida.js
          grep -F '2026-09-04-faccoes-registrar-saida-restaurado-283' corponu-release.json

      - name: Conferir diff
        run: git diff --check

      - name: Commitar alteracoes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corponu-faccoes-tres-abas-saida.js corponu-atualizador.js update.js index.html corponu-release.json version.json
          git diff --cached --quiet && { echo 'Nenhuma alteracao para commit.'; exit 1; }
          git commit -m 'fix: restaurar Registrar saída em Facções 283'
          git push origin HEAD:main
