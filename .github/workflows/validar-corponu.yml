name: Validar CorpoNu

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' arquivo; do
            echo "Validando $arquivo"
            if [[ "$arquivo" == *.mjs ]]; then
              node --check "$arquivo"
            else
              node --input-type=module --check < "$arquivo"
            fi
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0)

      - name: Executar testes automatizados V2
        shell: bash
        run: |
          set -euo pipefail
          node --test v2/tests/*.test.mjs

      - name: Validar JSON
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const arquivos = fs.readdirSync('.').filter(nome => nome.endsWith('.json'));
          for (const arquivo of arquivos) {
            console.log(`Validando ${arquivo}`);
            JSON.parse(fs.readFileSync(arquivo, 'utf8'));
          }
          const release = JSON.parse(fs.readFileSync('corponu-release.json', 'utf8'));
          if (!String(release.version || '').trim()) {
            throw new Error('corponu-release.json está sem versão.');
          }
          NODE

      - name: Gerar pacote da homologação V2
        uses: actions/upload-artifact@v4
        with:
          name: corpo-nu-flow-homologacao-v2
          path: |
            homologacao-v2
            v2
            style.css
          if-no-files-found: error
          retention-days: 7

      - name: Gerar pacote Firebase V2 somente leitura
        uses: actions/upload-artifact@v4
        with:
          name: corpo-nu-flow-v2-firebase-readonly
          path: |
            firebase-v2-leitura
            v2
            style.css
            corponu-v2-firebase-bridge.js
          if-no-files-found: error
          retention-days: 7

      - name: Gerar pacote Firebase V2 escrita controlada
        uses: actions/upload-artifact@v4
        with:
          name: corpo-nu-flow-v2-escrita-controlada-ordens-manejo
          path: |
            firebase-v2-escrita-controlada
            v2
            style.css
            corponu-v2-firebase-bridge.js
          if-no-files-found: error
          retention-days: 7

      - name: Gerar pacote Firebase V2 Facções e Chegada
        uses: actions/upload-artifact@v4
        with:
          name: corpo-nu-flow-v2-faccoes-chegada-controlada
          path: |
            firebase-v2-faccoes-chegada
            v2
            style.css
            corponu-v2-firebase-bridge.js
          if-no-files-found: error
          retention-days: 7

      - name: Gerar pacote Firebase V2 Fechamento controlado
        uses: actions/upload-artifact@v4
        with:
          name: corpo-nu-flow-v2-fechamento-controlado
          path: |
            firebase-v2-fechamento-controlado
            v2
            style.css
          if-no-files-found: error
          retention-days: 7
