name: Publicar reparo listas principais 299

on:
  push:
    paths:
      - '.github/workflows/publicar-reparo-listas-principais-299.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirmar base 298
        run: |
          grep -F '2026-09-09-reparo-listas-fases-298' update.js
          grep -F '2026-09-09-reparo-listas-fases-298' version.json

      - name: Obter reparo 299 validado
        run: |
          curl -fsSL "https://raw.githubusercontent.com/99eliel/corpunuteste/68d603a1d8b50ee0355d099fdbcbb4cdee73448e/scripts/reparar-listas-principais-299.js" -o /tmp/reparar-listas-principais-299.js

      - name: Aplicar reparo estrutural 299
        run: node /tmp/reparar-listas-principais-299.js

      - name: Atualizar release 299
        run: |
          node <<'NODE'
          const fs = require('fs');
          const antigo = '2026-09-09-reparo-listas-fases-298';
          const novo = '2026-09-09-reparo-listas-principais-299';
          for (const arquivo of ['update.js', 'index.html', 'corponu-atualizador.js']) {
            let texto = fs.readFileSync(arquivo, 'utf8');
            if (!texto.includes(antigo)) throw new Error(`${arquivo}: versão 298 não encontrada`);
            texto = texto.split(antigo).join(novo);
            fs.writeFileSync(arquivo, texto, 'utf8');
          }
          const notes = 'Produção. Corrige a recuperação das listas principais de Fase Bojo/Sutiã e Fase da Calcinha quando ficaram vazias. A reconstrução 299 consulta formatos atuais e legados das OPs, sugestões locais antigas, mapa de ordens carregado e logs administrativos, sempre respeitando sugestoesExcluidas e o último estado de adicionar/remover. A Fase Lateral já recuperada na 298 é preservada. Nenhuma OP histórica é alterada.';
          const agora = new Date().toISOString();
          for (const arquivo of ['version.json', 'corponu-release.json']) {
            const dados = JSON.parse(fs.readFileSync(arquivo, 'utf8'));
            dados.version = novo;
            dados.updatedAt = agora;
            dados.notes = notes;
            fs.writeFileSync(arquivo, JSON.stringify(dados, null, 2) + '\n', 'utf8');
          }
          NODE

      - name: Validar sintaxe e invariantes
        run: |
          node --check update.js
          grep -F 'async function repararListasPrincipaisFasesV299()' update.js
          grep -F 'reparoListasPrincipais20260909V299' update.js
          grep -F 'window.corponuDualMode?.state?.maps?.ordens' update.js
          test "$(grep -c 'await repararListasPrincipaisFasesV299();' update.js)" -eq 2
          grep -F '2026-09-09-reparo-listas-principais-299' update.js
          grep -F '2026-09-09-reparo-listas-principais-299' version.json
          grep -F '2026-09-09-reparo-listas-principais-299' corponu-release.json

      - name: Garantir escopo exato
        run: |
          arquivos="$(git diff --name-only | sort)"
          esperado="$(printf '%s\n' corponu-atualizador.js corponu-release.json index.html update.js version.json | sort)"
          test "$arquivos" = "$esperado" || { echo "Arquivos inesperados:"; echo "$arquivos"; exit 1; }

      - name: Commitar release 299
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corponu-atualizador.js corponu-release.json index.html update.js version.json
          git commit -m "fix: recuperar listas principais de fases 299"
          git push
