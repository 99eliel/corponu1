name: Organizar Processos Sutiã 268

on:
  push:
    branches: [main]
    paths:
      - 'scripts/organizar-processos-sutia-singleflight-268.js'
      - '.github/workflows/organizar-processos-sutia-singleflight-268.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aplicar organização estrutural
        run: node scripts/organizar-processos-sutia-singleflight-268.js

      - name: Validar JavaScript
        run: |
          node --check corponu-sutia-completo-calculo-base-174.js
          node --check corponu-sutia-completo-calculo.js
          node --check corponu-processos-somente-valores.js
          node --check corponu-atualizador.js
          node --check update.js

      - name: Validar JSON e invariantes
        run: |
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"
          grep -q 'let configProcessosPromise = null;' corponu-sutia-completo-calculo-base-174.js
          grep -q 'async function montarConfigProcessos()' corponu-sutia-completo-calculo-base-174.js
          grep -q 'if (configProcessosPromise) return configProcessosPromise;' corponu-sutia-completo-calculo-base-174.js
          ! grep -q 'tentativas >= 30' corponu-sutia-completo-calculo-base-174.js
          ! grep -q '\[0, 250, 800\]\.forEach' corponu-sutia-completo-calculo-base-174.js

      - name: Gravar alteração
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name '99eliel'
          git config user.email '131190282+99eliel@users.noreply.github.com'
          git add corponu-sutia-completo-calculo-base-174.js update.js corponu-atualizador.js index.html corponu-release.json version.json
          git commit -m 'refactor: inicialização única do Sutiã em Processos 268'
          git push origin HEAD:main
