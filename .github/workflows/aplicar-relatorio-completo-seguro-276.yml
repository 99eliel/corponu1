name: Relatorio completo seguro 276

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-relatorio-completo-seguro-276.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar migrador
        run: node --check scripts/aplicar-relatorio-completo-seguro-276.js

      - name: Aplicar correção
        run: node scripts/aplicar-relatorio-completo-seguro-276.js

      - name: Validar JavaScript e JSON
        run: |
          node --check corponu-pagamentos-seguro.js
          node --check update.js
          node --check corponu-atualizador.js
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"

      - name: Validar pós-condições
        run: |
          grep -q 'function interceptarRelatorioCompletoSeguro' corponu-pagamentos-seguro.js
          ! grep -q 'interceptarRelatorioCompletoAgrupado' corponu-pagamentos-seguro.js
          grep -q 'movimento?.destinoId' corponu-pagamentos-seguro.js
          grep -q '2026-08-31-pagamentos-relatorio-completo-seguro-276' corponu-release.json
          git diff --check

      - name: Publicar correção
        run: |
          git config user.name 99eliel
          git config user.email 131190282+99eliel@users.noreply.github.com
          git add corponu-pagamentos-seguro.js corponu-release.json version.json index.html update.js corponu-atualizador.js
          git diff --cached --quiet && { echo 'Nenhuma alteração funcional.'; exit 1; }
          git commit -m "fix: unificar relatório completo no gerador seguro 276"
          git push origin HEAD:main
