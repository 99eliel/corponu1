name: Relatorio PIX 275

on:
  push:
    branches:
      - main
    paths:
      - scripts/corrigir-relatorio-pix-por-destinoid-275.js

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node --check scripts/corrigir-relatorio-pix-por-destinoid-275.js
      - run: node scripts/corrigir-relatorio-pix-por-destinoid-275.js
      - run: node --check corponu-pagamentos-seguro.js && node --check update.js && node --check corponu-atualizador.js
      - run: node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"
      - run: git diff --check
      - run: |
          git config user.name 99eliel
          git config user.email 131190282+99eliel@users.noreply.github.com
          git add corponu-atualizador.js corponu-pagamentos-seguro.js corponu-release.json index.html update.js version.json
          git diff --cached --quiet && exit 1 || true
          git commit -m "fix: vincular PIX ao destinoId da movimentacao 275"
          git push origin HEAD:main
