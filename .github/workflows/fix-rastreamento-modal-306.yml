name: Validar Rastreamento 306

on:
  push:
    branches:
      - 'fix/rastreamento-modal-306'
    paths:
      - '.github/workflows/fix-rastreamento-modal-306.yml'

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/rastreamento-modal-306

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar correção estrutural
        run: node scripts/fix-rastreamento-modal-306.js

      - name: Validar sintaxe e arquitetura
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check corponu-atualizador.js
          node --check update.js
          node -e "JSON.parse(require('fs').readFileSync('version.json','utf8')); JSON.parse(require('fs').readFileSync('corponu-release.json','utf8'));"
          grep -F 'const botaoAjusteRastreamento = event.target.closest?.("[data-rastreamento-ajuste-id]");' app.js
          test "$(grep -o 'data-rastreamento-ajuste-id=' app.js | wc -l)" -eq 4
          ! grep -Fq 'onclick="abrirModalAjusteMigracao(' app.js
          ! grep -Fq 'corponu-rastreamento-enviar-manejo.js' index.html
          grep -Fq '2026-09-10-rastreamento-controlador-unico-306' version.json
          git diff --check

      - name: Garantir escopo
        shell: bash
        run: |
          set -euo pipefail
          arquivos="$(git diff --name-only | sort)"
          esperado="$(printf '%s\n' app.js corponu-atualizador.js corponu-release.json index.html update.js version.json | sort)"
          test "$arquivos" = "$esperado"

      - name: Commitar correção validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js corponu-atualizador.js corponu-release.json index.html update.js version.json
          git commit -m 'fix: consolidar controlador do Rastreamento 306'
          git push origin HEAD:fix/rastreamento-modal-306
