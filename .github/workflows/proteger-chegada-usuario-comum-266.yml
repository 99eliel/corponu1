name: Proteger chegada usuário comum 266

on:
  push:
    branches: [main]
    paths:
      - 'scripts/proteger-chegada-usuario-comum-266.js'
      - 'scripts/proteger-chegada-usuario-comum-266-v2.js'
      - '.github/workflows/proteger-chegada-usuario-comum-266.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aplicar proteção estrutural
        run: node scripts/proteger-chegada-usuario-comum-266-v2.js

      - name: Validar JavaScript
        run: |
          node --check app.js
          node --check update.js
          node --check corponu-atualizador.js

      - name: Validar JSON e pós-condições
        run: |
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"
          grep -q 'async function avisarChegadaMovimentacaoFaccao' app.js
          grep -q 'function htmlAcaoChegadaFaccoes' app.js
          grep -q 'Avisar que chegou' app.js
          grep -q 'Aviso enviado' app.js
          grep -q 'Apenas administrador pode confirmar a chegada e gerar pagamento' app.js
          grep -q 'Apenas administrador pode gerar pagamento pela chegada de facção' app.js
          grep -q 'confirmacaoChegadaFinanceira: true' app.js
          grep -q '2026-08-28-chegada-usuario-somente-aviso-266' corponu-release.json

      - name: Gravar alteração
        run: |
          git config user.name "99eliel"
          git config user.email "131190282+99eliel@users.noreply.github.com"
          git add app.js index.html update.js corponu-atualizador.js corponu-release.json version.json
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'fix: restringir chegada financeira ao administrador 266'
          git push
