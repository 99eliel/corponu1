name: Publicar fase oficial da Calcinha 295

on:
  push:
    paths:
      - '.github/workflows/publicar-fase-oficial-calcinha-295.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar trava estrutural da fase Calcinha
        run: node scripts/corrigir-fase-oficial-calcinha-295.js

      - name: Publicar release 295
        run: |
          node <<'NODE'
          const fs = require('fs');
          const OLD = '2026-09-09-acoes-menu-manejo-294';
          const NEW = '2026-09-09-fase-oficial-calcinha-295';
          const notes = 'Produção. Manejo Calcinha passa a aceitar somente fases cadastradas pelo administrador em configuracoes/fasesManejoCalcinha. O campo livre/datalist e fontes legadas de localStorage foram removidos do módulo dedicado. Antes de salvar ou enviar, a fase é confirmada diretamente no servidor. Fases antigas fora da lista permanecem apenas como legado visual e exigem nova escolha oficial.';

          for (const arquivo of ['update.js', 'index.html', 'corponu-atualizador.js']) {
            let texto = fs.readFileSync(arquivo, 'utf8');
            if (!texto.includes(OLD)) throw new Error(`${arquivo}: release 294 não encontrada`);
            texto = texto.split(OLD).join(NEW);
            fs.writeFileSync(arquivo, texto, 'utf8');
          }

          for (const arquivo of ['version.json', 'corponu-release.json']) {
            const obj = JSON.parse(fs.readFileSync(arquivo, 'utf8'));
            if (obj.version !== OLD) throw new Error(`${arquivo}: versão inesperada ${obj.version}`);
            obj.version = NEW;
            obj.updatedAt = '2026-09-09T12:20:00-03:00';
            obj.notes = notes;
            fs.writeFileSync(arquivo, JSON.stringify(obj, null, 2) + '\n', 'utf8');
          }
          NODE

      - name: Validar JavaScript, JSON e invariantes
        run: |
          node --check corponu-manejo-calcinha-dedicado-253.js
          node --check update.js
          node --check corponu-atualizador.js
          node -e "JSON.parse(require('fs').readFileSync('version.json','utf8')); JSON.parse(require('fs').readFileSync('corponu-release.json','utf8'));"
          grep -F '2026-09-09-fase-oficial-calcinha-295' index.html
          grep -F '2026-09-09-fase-oficial-calcinha-295' update.js
          grep -F '2026-09-09-fase-oficial-calcinha-295' corponu-atualizador.js
          grep -F 'FASES_CONFIG_DOCUMENTO = "fasesManejoCalcinha"' corponu-manejo-calcinha-dedicado-253.js
          grep -F 'function renderCampoFaseOficialCalcinha' corponu-manejo-calcinha-dedicado-253.js
          grep -F 'async function validarFaseOficialCalcinhaAntesDeSalvar' corponu-manejo-calcinha-dedicado-253.js
          grep -F 'somenteServidor: true' corponu-manejo-calcinha-dedicado-253.js
          grep -F 'Essa fase não está cadastrada pelo administrador para a Calcinha.' corponu-manejo-calcinha-dedicado-253.js
          ! grep -F 'fasesManejoExtras' corponu-manejo-calcinha-dedicado-253.js
          ! grep -F 'document.querySelectorAll("#manejoFasesList option")' corponu-manejo-calcinha-dedicado-253.js
          ! grep -F 'type="text" list="${DATALIST_ID}"' corponu-manejo-calcinha-dedicado-253.js
          ! grep -F 'servicePaymentHold' index.html
          ! grep -F 'data-service-hold="payment"' index.html
          git diff --check

      - name: Garantir escopo exato
        run: |
          arquivos="$(git diff --name-only | sort)"
          esperado="$(printf '%s\n' corponu-atualizador.js corponu-manejo-calcinha-dedicado-253.js corponu-release.json index.html update.js version.json | sort)"
          test "$arquivos" = "$esperado"

      - name: Commitar release 295
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corponu-atualizador.js corponu-manejo-calcinha-dedicado-253.js corponu-release.json index.html update.js version.json
          git commit -m 'fix: restringir fase da Calcinha às opções do admin 295'
          git push origin HEAD:main
