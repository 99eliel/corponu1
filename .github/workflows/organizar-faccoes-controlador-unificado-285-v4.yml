name: Organizar Facções Controlador Unificado 285 v4

on:
  push:
    paths:
      - '.github/workflows/organizar-faccoes-controlador-unificado-285-v4.yml'

permissions:
  contents: write

jobs:
  organizar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Ajustar limite função-constante do migrador
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/organizar-faccoes-controlador-unificado-285.py')
          s = p.read_text(encoding='utf-8')
          old = '''def replace_function(src, signature, next_signature, replacement):
              start = find_function_start(src, signature)
              end = find_function_start(src, next_signature, start + 1)
              if start < 0 or end < 0:
                  raise RuntimeError(f"Função {signature} ou próxima {next_signature} não encontrada")
              return src[:start] + replacement.rstrip() + "\\n\\n" + src[end:]'''
          old = '\n'.join(line[12:] if line.startswith('            ') else line for line in old.splitlines())
          new = '''def replace_function(src, signature, next_signature, replacement):
              start = find_function_start(src, signature)
              if next_signature.startswith("const "):
                  end = src.find(f"  {next_signature}", start + 1)
              else:
                  end = find_function_start(src, next_signature, start + 1)
              if start < 0 or end < 0:
                  raise RuntimeError(f"Função {signature} ou próximo bloco {next_signature} não encontrado")
              return src[:start] + replacement.rstrip() + "\\n\\n" + src[end:]'''
          new = '\n'.join(line[12:] if line.startswith('            ') else line for line in new.splitlines())
          if old not in s:
              raise SystemExit('Helper replace_function não encontrado; abortando.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Aplicar reorganização estrutural
        shell: bash
        run: |
          set +e
          python scripts/organizar-faccoes-controlador-unificado-285.py > /tmp/faccoes-285.log 2>&1
          status=$?
          cat /tmp/faccoes-285.log
          mkdir -p /tmp/faccoes-285-diag
          cp /tmp/faccoes-285.log /tmp/faccoes-285-diag/migracao.log
          exit $status

      - name: Salvar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faccoes-285-diagnostico-v4
          path: /tmp/faccoes-285-diag
          if-no-files-found: ignore
          retention-days: 1

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < corponu-dual-mode.js
          node --input-type=module --check < corponu-faccoes-tres-abas-saida.js
          node --input-type=module --check < corponu-faccoes-lateral-alca-v2-270.js
          node --input-type=module --check < corponu-atualizador.js
          node --input-type=module --check < update.js

      - name: Validar arquitetura de Facções
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"
          grep -F 'function setActiveFaccoesType' corponu-dual-mode.js
          grep -F 'data-type="lateral_alca"' corponu-dual-mode.js
          grep -F 'corponu:movimentacoes-atualizadas' corponu-dual-mode.js
          grep -F 'hidratarMovimentosCompartilhados' corponu-faccoes-lateral-alca-v2-270.js
          grep -F 'preload: () => carregarTudo(false)' corponu-faccoes-lateral-alca-v2-270.js
          grep -F 'corponu:faccoes-mode' corponu-faccoes-tres-abas-saida.js
          ! grep -F 'stopImmediatePropagation()' corponu-faccoes-tres-abas-saida.js
          ! grep -F 'abaFaccaoCorte' corponu-faccoes-tres-abas-saida.js
          ! grep -F 'function carregarLegados()' corponu-faccoes-lateral-alca-v2-270.js
          ! grep -F 'async function carregarLegados()' corponu-faccoes-lateral-alca-v2-270.js
          grep -F '2026-09-04-faccoes-controlador-unificado-285' corponu-release.json

      - name: Conferir diff
        run: git diff --check

      - name: Commitar alterações
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corponu-dual-mode.js corponu-faccoes-tres-abas-saida.js corponu-faccoes-lateral-alca-v2-270.js corponu-atualizador.js update.js index.html corponu-release.json version.json
          git diff --cached --quiet && { echo 'Nenhuma alteração para commit.'; exit 1; }
          git commit -m 'refactor: unificar controlador da aba Facções 285'
          git push origin HEAD:main
