name: Publicar exclusão Facções 296

on:
  push:
    paths:
      - '.github/workflows/publicar-exclusao-faccoes-296.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Consolidar exclusão de Facções no app principal
        run: node scripts/consolidar-exclusao-faccoes-296.js

      - name: Publicar release 296
        run: |
          node <<'NODE'
          const fs = require('fs');
          const OLD = '2026-09-09-fase-oficial-calcinha-295';
          const NEW = '2026-09-09-exclusao-faccoes-estavel-296';
          const notes = 'Produção. Exclusão de movimentações de Facções consolidada no app.js como único dono do fluxo. O wrapper antigo que substituía a função em runtime e fazia polling deixou de ser carregado. Pagamentos já pagos continuam protegidos; pagamentos pendentes vinculados são removidos atomicamente com a movimentação. Exclusões fora de Facções preservam o comportamento anterior.';

          for (const arquivo of ['corponu-atualizador.js', 'index.html', 'update.js']) {
            let texto = fs.readFileSync(arquivo, 'utf8');
            if (!texto.includes(OLD)) throw new Error(`${arquivo}: release 295 não encontrada.`);
            texto = texto.split(OLD).join(NEW);
            fs.writeFileSync(arquivo, texto, 'utf8');
          }

          for (const arquivo of ['version.json', 'corponu-release.json']) {
            const obj = JSON.parse(fs.readFileSync(arquivo, 'utf8'));
            if (obj.version !== OLD) throw new Error(`${arquivo}: versão inesperada ${obj.version}`);
            obj.version = NEW;
            obj.updatedAt = new Date().toISOString();
            obj.notes = notes;
            fs.writeFileSync(arquivo, JSON.stringify(obj, null, 2) + '\n', 'utf8');
          }
          NODE

      - name: Validar sintaxe, versão e invariantes
        run: |
          node --check app.js
          node --check corponu-atualizador.js
          node --check update.js
          node -e "JSON.parse(require('fs').readFileSync('version.json','utf8')); JSON.parse(require('fs').readFileSync('corponu-release.json','utf8'));"
          grep -F '2026-09-09-exclusao-faccoes-estavel-296' index.html
          grep -F '2026-09-09-exclusao-faccoes-estavel-296' update.js
          grep -F '2026-09-09-exclusao-faccoes-estavel-296' corponu-atualizador.js
          grep -F 'const exclusoesMovimentacaoEmAndamento = new Set();' app.js
          grep -F 'where("movimentacaoId", "==", movimentacaoId)' app.js
          grep -F 'batch.delete(doc(db, "movimentacoesProducao", movimentacaoId));' app.js
          grep -F 'Não é possível excluir: existe pagamento desta movimentação já marcado como pago.' app.js
          ! grep -F 'corponu-faccoes-exclusao-pagamento-vinculado.js' corponu-atualizador.js
          ! grep -F 'servicePaymentHold' index.html
          ! grep -F 'data-service-hold="payment"' index.html
          git diff --check

      - name: Garantir escopo exato
        run: |
          arquivos="$(git diff --name-only | sort)"
          esperado="$(printf '%s\n' app.js corponu-atualizador.js corponu-release.json index.html update.js version.json | sort)"
          test "$arquivos" = "$esperado"

      - name: Commitar release 296
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js corponu-atualizador.js corponu-release.json index.html update.js version.json
          git commit -m 'fix: estabilizar exclusão de Facções release 296'
          git push origin HEAD:main
