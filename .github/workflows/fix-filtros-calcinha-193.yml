name: Fix filtros Calcinha 193

on:
  push:
    paths:
      - '.trigger-filtros-calcinha-193'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir leitura das colunas da Calcinha
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('update.js')
          text = p.read_text(encoding='utf-8')
          old = '''  function valorLinhaFiltroExcel(linha, config) {
    if (!linha || !config) return "";
    const celula = linha.cells?.[config.coluna];
'''
          new = '''  function valorLinhaFiltroExcel(linha, config) {
    if (!linha || !config) return "";

    let coluna = config.coluna;
    if (setorAtualFiltroExcelManejo() === "calcinha") {
      const campoFiltro = document.getElementById(config.id);
      const celulaFiltro = campoFiltro?.closest("th");
      const linhaFiltros = celulaFiltro?.parentElement;
      if (celulaFiltro && linhaFiltros?.classList?.contains("manejo-filter-row")) {
        const indiceReal = Array.prototype.indexOf.call(linhaFiltros.children, celulaFiltro);
        if (indiceReal >= 0) coluna = indiceReal;
      }
    }

    const celula = linha.cells?.[coluna];
'''
          if old not in text:
              raise SystemExit('Trecho valorLinhaFiltroExcel nao encontrado; nada alterado.')
          text = text.replace(old, new, 1)
          text = text.replace('const APP_VERSION = "2026-08-12-precos-selecao-estavel-187";', 'const APP_VERSION = "2026-08-12-calcinha-filtros-dados-193";', 1)
          p.write_text(text, encoding='utf-8')

          idx = Path('index.html')
          html = idx.read_text(encoding='utf-8')
          html = html.replace('update.js?v=2026-08-12-precos-selecao-estavel-187', 'update.js?v=2026-08-12-calcinha-filtros-dados-193')
          idx.write_text(html, encoding='utf-8')

          version = {
            'version': '2026-08-12-calcinha-filtros-dados-193',
            'updatedAt': '2026-08-12T22:20:00-03:00',
            'notes': 'Corrige somente os filtros acumulativos do Manejo Calcinha: as opcoes e a aplicacao do filtro passam a localizar a coluna real pelo ID do proprio filtro, eliminando o deslocamento que fazia Necessidade ler valores de Cor. O Manejo Sutia continua usando os indices anteriores sem alteracao.'
          }
          Path('version.json').write_text(json.dumps(version, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('corponu-release.json').write_text(json.dumps(version, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          node --check update.js
      - name: Limpar temporarios e publicar
        run: |
          rm -f .trigger-filtros-calcinha-193
          rm -f .github/workflows/fix-filtros-calcinha-193.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: alinhar dados dos filtros da Calcinha 193 [skip ci]"
          git push origin HEAD:main
