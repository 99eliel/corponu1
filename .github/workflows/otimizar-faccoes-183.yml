name: Otimizar fluxos de facções 183
on:
  push:
    branches: [main]
    paths: ['.otimizar-faccoes-183']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar otimização conservadora
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          # 1) INTERLOCK passa a existir diretamente no cadastro/edição da facção.
          p = Path('corponu-faccoes-grupos-processos.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'const VERSION = "2026-07-31-faccoes-grupos-processos-43";',
              'const VERSION = "2026-08-12-faccoes-otimizadas-183";',
              1
          )
          lateral = '    { nome: "LATERAL", atendeSutia: true, atendeCalcinha: false },\n'
          interlock = '    { nome: "INTERLOCK", atendeSutia: true, atendeCalcinha: true },\n'
          if interlock not in s:
              if lateral not in s:
                  raise SystemExit('Não encontrei o ponto seguro para incluir INTERLOCK no formulário da facção.')
              s = s.replace(lateral, lateral + interlock, 1)
          p.write_text(s, encoding='utf-8')

          # 2) INTERLOCK entra diretamente no seletor original de Registrar saída.
          p = Path('corponu-faccoes-processos-cadastrados.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'const VERSION = "2026-07-30-faccoes-processos-cadastrados-27";',
              'const VERSION = "2026-08-12-faccoes-otimizadas-183";',
              1
          )
          antigo = '    "ALÇA",\n    "CALCINHA MONTAGEM",'
          novo = '    "ALÇA",\n    "INTERLOCK",\n    "CALCINHA MONTAGEM",'
          if '    "INTERLOCK",\n    "CALCINHA MONTAGEM",' not in s:
              if antigo not in s:
                  raise SystemExit('Não encontrei a lista padrão do seletor de processos.')
              s = s.replace(antigo, novo, 1)

          bloco_antigo = '''      PROCESSOS_PADRAO.forEach(nome => {
        adicionarLista(porAba.corte, nome);
        if (normalizar(nome).includes("CALCINHA")) adicionarLista(porAba.calcinha, nome);
        else adicionarLista(porAba.sutia, nome);
      });'''
          bloco_novo = '''      PROCESSOS_PADRAO.forEach(nome => {
        adicionarLista(porAba.corte, nome);
        const chave = normalizar(nome);
        if (chave === "INTERLOCK") {
          adicionarLista(porAba.sutia, nome);
          adicionarLista(porAba.calcinha, nome);
        } else if (chave.includes("CALCINHA")) {
          adicionarLista(porAba.calcinha, nome);
        } else {
          adicionarLista(porAba.sutia, nome);
        }
      });'''
          if bloco_novo not in s:
              if bloco_antigo not in s:
                  raise SystemExit('Não encontrei a distribuição segura dos processos por aba.')
              s = s.replace(bloco_antigo, bloco_novo, 1)
          p.write_text(s, encoding='utf-8')

          # 3) Não forçar leitura completa da coleção faccoes a cada troca de processo.
          # O próprio módulo já possui cache de 10 segundos e invalida quando necessário.
          p = Path('corponu-faccoes-grupos-saida-fix.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'const VERSION = "2026-07-31-faccoes-saida-unificada-47";',
              'const VERSION = "2026-08-12-faccoes-otimizadas-183";',
              1
          )
          alvo = '    const faccoes = await carregarFaccoes(true);'
          if alvo in s:
              s = s.replace(alvo, '    const faccoes = await carregarFaccoes(false);', 1)
          elif '    const faccoes = await carregarFaccoes(false);' not in s:
              raise SystemExit('Não encontrei a leitura forçada das facções para otimizar.')
          p.write_text(s, encoding='utf-8')

          # 4) Desativar o hotfix visual 182: ele usava observers/timers para recolocar INTERLOCK.
          # Mantemos o arquivo como no-op para navegadores que ainda tenham o loader antigo em cache.
          Path('corponu-interlock-ui-182.js').write_text('''(() => {
  "use strict";
  window.__CORPONU_INTERLOCK_UI_182__ = "desativado-na-183";
})();
''', encoding='utf-8')

          # Retira o carregamento ativo do hotfix 182.
          p = Path('corponu-pagamentos-alerta-duplicidades.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('  const VERSION_INTERLOCK_UI = "2026-08-12-interlock-ui-182";\n', '', 1)
          bloco = '''  carregarScript(
    "corponu-interlock-ui-182.js",
    "interlock-ui-182",
    VERSION_INTERLOCK_UI,
    "Não foi possível exibir o processo INTERLOCK nas telas de facções."
  );

'''
          s = s.replace(bloco, '', 1)
          p.write_text(s, encoding='utf-8')

          # 5) Corrige a divergência de version.json criada na 181.
          # update.js é versão 181; deixar version.json antigo fazia limpar cache/recarregar em nova sessão.
          Path('version.json').write_text(json.dumps({
              'version': '2026-08-12-interlock-global-181',
              'updatedAt': '2026-08-12T13:50:00-03:00',
              'notes': 'Sincroniza o verificador legado de update.js com sua versão interna para impedir limpeza de cache e recarga desnecessárias.'
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('corponu-release.json').write_text(json.dumps({
              'version': '2026-08-12-faccoes-otimizadas-183',
              'updatedAt': '2026-08-12T13:50:00-03:00',
              'notes': 'Otimização conservadora dos fluxos de facções: INTERLOCK passa a integrar diretamente as listas originais, o hotfix visual com observers/timers é desativado, a troca de processo reaproveita o cache já existente de facções e o verificador legado de versão deixa de limpar cache/recarregar sem necessidade. Não altera regras de chegada, saída ou pagamento.'
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          node --check corponu-faccoes-grupos-processos.js
          node --check corponu-faccoes-processos-cadastrados.js
          node --check corponu-faccoes-grupos-saida-fix.js
          node --check corponu-interlock-ui-182.js
          node --check corponu-pagamentos-alerta-duplicidades.js
          python -m json.tool version.json >/dev/null
          python -m json.tool corponu-release.json >/dev/null

          git rm -f .github/workflows/otimizar-faccoes-183.yml .otimizar-faccoes-183 || true
          git add corponu-faccoes-grupos-processos.js corponu-faccoes-processos-cadastrados.js corponu-faccoes-grupos-saida-fix.js corponu-interlock-ui-182.js corponu-pagamentos-alerta-duplicidades.js version.json corponu-release.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf: estabilizar chegada e saída de facções 183 [skip ci]"
          git push
