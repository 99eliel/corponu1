name: Otimizar fluxos de faccoes 183

on:
  push:
    branches:
      - main
    paths:
      - '.otimizar-faccoes-183'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar otimizacao conservadora
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('corponu-faccoes-grupos-processos.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const VERSION = "2026-07-31-faccoes-grupos-processos-43";', 'const VERSION = "2026-08-12-faccoes-otimizadas-183";', 1)
          lateral = '    { nome: "LATERAL", atendeSutia: true, atendeCalcinha: false },\n'
          interlock = '    { nome: "INTERLOCK", atendeSutia: true, atendeCalcinha: true },\n'
          if interlock not in s:
              if lateral not in s:
                  raise SystemExit('Ponto do INTERLOCK no formulario de faccao nao encontrado')
              s = s.replace(lateral, lateral + interlock, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('corponu-faccoes-processos-cadastrados.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const VERSION = "2026-07-30-faccoes-processos-cadastrados-27";', 'const VERSION = "2026-08-12-faccoes-otimizadas-183";', 1)
          antigo = '    "ALÇA",\n    "CALCINHA MONTAGEM",'
          novo = '    "ALÇA",\n    "INTERLOCK",\n    "CALCINHA MONTAGEM",'
          if '    "INTERLOCK",\n    "CALCINHA MONTAGEM",' not in s:
              if antigo not in s:
                  raise SystemExit('Lista padrao dos processos de saida nao encontrada')
              s = s.replace(antigo, novo, 1)
          bloco_antigo = '      PROCESSOS_PADRAO.forEach(nome => {\n        adicionarLista(porAba.corte, nome);\n        if (normalizar(nome).includes("CALCINHA")) adicionarLista(porAba.calcinha, nome);\n        else adicionarLista(porAba.sutia, nome);\n      });'
          bloco_novo = '      PROCESSOS_PADRAO.forEach(nome => {\n        adicionarLista(porAba.corte, nome);\n        const chave = normalizar(nome);\n        if (chave === "INTERLOCK") {\n          adicionarLista(porAba.sutia, nome);\n          adicionarLista(porAba.calcinha, nome);\n        } else if (chave.includes("CALCINHA")) {\n          adicionarLista(porAba.calcinha, nome);\n        } else {\n          adicionarLista(porAba.sutia, nome);\n        }\n      });'
          if bloco_novo not in s:
              if bloco_antigo not in s:
                  raise SystemExit('Distribuicao dos processos por aba nao encontrada')
              s = s.replace(bloco_antigo, bloco_novo, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('corponu-faccoes-grupos-saida-fix.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const VERSION = "2026-07-31-faccoes-saida-unificada-47";', 'const VERSION = "2026-08-12-faccoes-otimizadas-183";', 1)
          alvo = '    const faccoes = await carregarFaccoes(true);'
          if alvo in s:
              s = s.replace(alvo, '    const faccoes = await carregarFaccoes(false);', 1)
          elif '    const faccoes = await carregarFaccoes(false);' not in s:
              raise SystemExit('Leitura forcada das faccoes nao encontrada')
          p.write_text(s, encoding='utf-8')

          Path('corponu-interlock-ui-182.js').write_text('(() => {\n  "use strict";\n  window.__CORPONU_INTERLOCK_UI_182__ = "desativado-na-183";\n})();\n', encoding='utf-8')

          p = Path('corponu-pagamentos-alerta-duplicidades.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('  const VERSION_INTERLOCK_UI = "2026-08-12-interlock-ui-182";\n', '', 1)
          bloco_loader = '  carregarScript(\n    "corponu-interlock-ui-182.js",\n    "interlock-ui-182",\n    VERSION_INTERLOCK_UI,\n    "Não foi possível exibir o processo INTERLOCK nas telas de facções."\n  );\n\n'
          s = s.replace(bloco_loader, '', 1)
          p.write_text(s, encoding='utf-8')

          Path('version.json').write_text(json.dumps({
              'version': '2026-08-12-interlock-global-181',
              'updatedAt': '2026-08-12T13:50:00-03:00',
              'notes': 'Sincroniza o verificador legado de update.js com sua versao interna para impedir limpeza de cache e recarga desnecessarias.'
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('corponu-release.json').write_text(json.dumps({
              'version': '2026-08-12-faccoes-otimizadas-183',
              'updatedAt': '2026-08-12T13:50:00-03:00',
              'notes': 'Otimiza os fluxos de faccoes sem alterar regras de negocio: INTERLOCK integra as listas originais, o hotfix visual com observers e timers e desativado, a troca de processo reaproveita o cache existente de faccoes e o verificador legado deixa de limpar cache e recarregar sem necessidade.'
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validar arquivos
        shell: bash
        run: |
          node --check corponu-faccoes-grupos-processos.js
          node --check corponu-faccoes-processos-cadastrados.js
          node --check corponu-faccoes-grupos-saida-fix.js
          node --check corponu-interlock-ui-182.js
          node --check corponu-pagamentos-alerta-duplicidades.js
          python -m json.tool version.json >/dev/null
          python -m json.tool corponu-release.json >/dev/null
          grep -q 'INTERLOCK' corponu-faccoes-grupos-processos.js
          grep -q 'INTERLOCK' corponu-faccoes-processos-cadastrados.js
          grep -q 'carregarFaccoes(false)' corponu-faccoes-grupos-saida-fix.js
          if grep -q 'VERSION_INTERLOCK_UI' corponu-pagamentos-alerta-duplicidades.js; then exit 1; fi

      - name: Publicar
        shell: bash
        run: |
          git rm -f .github/workflows/otimizar-faccoes-183.yml .otimizar-faccoes-183
          git add corponu-faccoes-grupos-processos.js corponu-faccoes-processos-cadastrados.js corponu-faccoes-grupos-saida-fix.js corponu-interlock-ui-182.js corponu-pagamentos-alerta-duplicidades.js version.json corponu-release.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf: estabilizar chegada e saida de faccoes 183 [skip ci]"
          git push
