name: Publicar fases Sutiã persistentes 290

on:
  push:
    paths:
      - '.github/workflows/publicar-fases-sutia-persistentes-290.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar correção já validada no repositório de teste
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/99eliel/corpunuteste/43321e113df830176967d2a4e4f36176d80ccf64/scripts/corrigir-fases-sutia-persistentes-290.js' -o /tmp/corrigir-fases-sutia.js
          node /tmp/corrigir-fases-sutia.js

      - name: Preparar release 290
        run: |
          node <<'NODE'
          const fs = require('fs');
          const OLD = '2026-09-09-fase-bojo-oficial-289';
          const NEW = '2026-09-09-fases-sutia-persistentes-290';
          const notes = 'Produção. Corrige estruturalmente a gestão de Fase Bojo do Sutiã: remove a imposição incorreta de duas opções fixas, reconstrói a lista administrada usando as fases históricas e os registros de adicionar/remover do administrador, e passa a registrar exclusões persistentes para que fases removidas não sejam recolocadas por recuperação histórica. OPs antigas permanecem intactas. A recuperação de opções antigas continua somente manual.';

          for (const arquivo of ['update.js', 'index.html', 'corponu-atualizador.js']) {
            let texto = fs.readFileSync(arquivo, 'utf8');
            if (!texto.includes(OLD)) throw new Error(`${arquivo}: release 289 não encontrada`);
            texto = texto.split(OLD).join(NEW);
            fs.writeFileSync(arquivo, texto, 'utf8');
          }

          for (const arquivo of ['version.json', 'corponu-release.json']) {
            const obj = JSON.parse(fs.readFileSync(arquivo, 'utf8'));
            if (obj.version !== OLD) throw new Error(`${arquivo}: versão inesperada ${obj.version}`);
            obj.version = NEW;
            obj.updatedAt = '2026-09-09T09:18:00-03:00';
            obj.notes = notes;
            fs.writeFileSync(arquivo, JSON.stringify(obj, null, 2) + '\n', 'utf8');
          }
          NODE

      - name: Validar sintaxe, escopo e invariantes
        run: |
          node --check update.js
          node --check corponu-atualizador.js
          node -e "JSON.parse(require('fs').readFileSync('version.json','utf8')); JSON.parse(require('fs').readFileSync('corponu-release.json','utf8'));"
          grep -F '2026-09-09-fases-sutia-persistentes-290' update.js
          grep -F '2026-09-09-fases-sutia-persistentes-290' index.html
          grep -F 'CAMPO_FASES_SUTIA_EXCLUIDAS' update.js
          grep -F 'MARCADOR_RECONSTRUCAO_FASES_SUTIA' update.js
          grep -F 'reconstruirListaFasesSutiaSeNecessario' update.js
          grep -F 'firestore.where("tipoAlvo", "==", "Sugestão de fase")' update.js
          grep -F 'await alterarSugestaoFaseSutiaPersistente(fase, "remover")' update.js
          grep -F 'await alterarSugestaoFaseSutiaPersistente(fase, "adicionar")' update.js
          grep -F 'restaurarOpcoesAntigasFases({ manual: true })' update.js
          ! grep -F 'restaurarOpcoesAntigasFases({ manual: false })' update.js
          ! grep -F 'FASES_BOJO_OFICIAIS' update.js
          ! grep -F 'migrarFaseBojoOficialSeNecessario' update.js
          ! grep -F 'servicePaymentHold' index.html
          ! grep -F 'data-service-hold="payment"' index.html
          git diff --check

      - name: Garantir somente os arquivos esperados
        run: |
          arquivos="$(git diff --name-only | sort)"
          esperado="$(printf '%s\n' corponu-atualizador.js corponu-release.json index.html update.js version.json | sort)"
          test "$arquivos" = "$esperado"

      - name: Publicar release 290
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corponu-atualizador.js corponu-release.json index.html update.js version.json
          git commit -m 'fix: restaurar gestão persistente das fases do Sutiã 290'
          git push origin HEAD:main
