name: Promover Fase Lateral 164

on:
  push:
    branches: [main]
    paths:
      - '.promover-fase-lateral-164'

permissions:
  contents: write

jobs:
  promover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copiar versão aprovada do ambiente de teste
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/99eliel/corpunuteste/main'
          for arquivo in app.js update.js style.css index.html; do
            curl -fsSL "$BASE/$arquivo" -o "$arquivo"
          done

      - name: Ajustar versionamento para produção
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          versao = '2026-08-10-fase-lateral-manejo-164'

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('style.css?v=2026-08-10-teste-fase-lateral-163b', f'style.css?v={versao}')
          html = html.replace('app.js?v=2026-08-10-teste-fase-lateral-163b', f'app.js?v={versao}')
          html = html.replace('update.js?v=2026-08-10-teste-fase-lateral-sugestoes-165b', f'update.js?v={versao}')
          index.write_text(html, encoding='utf-8')

          release = {
            'version': versao,
            'updatedAt': '2026-08-10T14:32:00-03:00',
            'notes': 'Publica a Fase Lateral no Manejo Sutiã após validação no ambiente de teste. A fase antiga passa a ser identificada como Fase Bojo; a nova Fase Lateral possui campo e filtro independentes, salvamento junto ao manejo, preservação ao movimentar/bipar e gestão administrativa própria de sugestões, incluindo adicionar, remover e recuperar opções antigas. Mantém integralmente as atualizações da release 163: ALÇA em R$ 0,0540, valores monetários com 4 casas decimais e recálculo administrativo seguro somente de pagamentos pendentes de ALÇA.'
          }
          Path('corponu-release.json').write_text(json.dumps(release, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validar JavaScript e integração
        run: |
          set -euo pipefail
          node --check app.js
          node --check update.js
          grep -q 'faseLateral' app.js
          grep -q 'fasesManejoSutiaLateral' update.js
          grep -q 'FASE LATERAL' index.html
          grep -q '2026-08-10-fase-lateral-manejo-164' corponu-release.json

      - name: Publicar e remover arquivos temporários
        run: |
          rm -f .promover-fase-lateral-164
          rm -f .github/workflows/promover-fase-lateral-164.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: Fase Lateral no Manejo Sutiã 164 [skip ci]'
          git push origin HEAD:main
