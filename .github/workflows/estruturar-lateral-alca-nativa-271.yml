name: Estruturar Lateral e Alça nativa 271

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/estruturar-lateral-alca-nativa-271.yml'

permissions:
  contents: write

jobs:
  estruturar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar migração estrutural
        run: node scripts/estruturar-lateral-alca-nativa-271.js

      - name: Validar JavaScript
        run: |
          node --check corponu-faccoes-lateral-alca-v2-270.js
          node --check corponu-faccoes-tres-abas-saida.js
          node --check corponu-dual-mode.js
          node --check corponu-processos-somente-valores.js
          node --check corponu-processos-valores-lateral-alca-271.js
          node --check corponu-atualizador.js
          node --check update.js

      - name: Validar JSON e pós-condições
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"
          test "$(grep -o 'id="abaFaccaoCorte"' index.html | wc -l)" -eq 1
          test "$(grep -o 'id="painelFaccoesCorte"' index.html | wc -l)" -eq 1
          test "$(grep -o 'id="processosValoresLateralAlca"' index.html | wc -l)" -eq 1
          ! grep -q 'cloneNode' corponu-faccoes-tres-abas-saida.js
          ! grep -q 'Valores de Lateral e Alça' corponu-faccoes-lateral-alca-v2-270.js
          grep -q 'corponu-processos-valores-lateral-alca-271.js' corponu-atualizador.js
          grep -q '2026-08-31-faccoes-lateral-alca-nativa-271' corponu-release.json

      - name: Conferir diff
        run: git diff --check && git diff --stat

      - name: Publicar alteração funcional
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "99eliel"
          git config user.email "131190282+99eliel@users.noreply.github.com"
          git add index.html style.css corponu-dual-mode.js corponu-faccoes-tres-abas-saida.js corponu-faccoes-lateral-alca-v2-270.js corponu-processos-somente-valores.js corponu-processos-valores-lateral-alca-271.js corponu-atualizador.js update.js corponu-release.json version.json
          git diff --cached --quiet && { echo 'Nenhuma alteração funcional para publicar.'; exit 1; }
          git commit -m "refactor: tornar Lateral e Alça nativa e mover valores para Processos 271"
          git push origin HEAD:main
