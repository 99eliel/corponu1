name: Aplicar carregamento Pagamentos 264

on:
  push:
    branches: [main]
    paths:
      - 'scripts/estabilizar-carregamento-pagamentos-264.js'
      - '.github/workflows/aplicar-carregamento-pagamentos-264.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar correção estrutural
        run: node scripts/estabilizar-carregamento-pagamentos-264.js
      - name: Validar JavaScript
        run: |
          node --check app.js
          node --check corponu-atualizador.js
          node --check update.js
      - name: Validar JSON e pós-condições
        run: |
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"
          grep -q 'pagamentosEstadoCarregamento' index.html
          grep -q 'carregarModulosDepoisDaNavegacao' corponu-atualizador.js
          grep -q '2026-08-27-pagamentos-carregamento-estavel-264' corponu-release.json
      - name: Gravar alteração
        run: |
          git config user.name "99eliel"
          git config user.email "131190282+99eliel@users.noreply.github.com"
          git add app.js index.html update.js corponu-atualizador.js corponu-release.json version.json
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'fix: estabilizar abertura da aba Pagamentos 264'
          git push
