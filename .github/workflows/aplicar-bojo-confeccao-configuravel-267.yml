name: Aplicar bojo configurável 267

on:
  push:
    branches: [main]
    paths:
      - 'scripts/aplicar-bojo-confeccao-configuravel-267.js'
      - '.github/workflows/aplicar-bojo-confeccao-configuravel-267.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aplicar regra configurável do bojo
        run: node scripts/aplicar-bojo-confeccao-configuravel-267.js

      - name: Validar JavaScript
        run: |
          node --check corponu-sutia-completo-calculo-base-174.js
          node --check corponu-sutia-completo-calculo.js
          node --check corponu-processos-somente-valores.js
          node --check corponu-atualizador.js
          node --check update.js

      - name: Validar JSON e regra
        run: |
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"
          grep -q 'id="sc51BojoConfeccao"' corponu-sutia-completo-calculo-base-174.js
          grep -q 'descontoBojoConfeccao: 0.5' corponu-sutia-completo-calculo-base-174.js
          grep -q 'bojo: dados.bojo.descontar ? arred4(configAtual.descontoBojoConfeccao) : 0' corponu-sutia-completo-calculo-base-174.js
          ! grep -q 'const precoBojo = dados.bojo.descontar ? await buscarPreco(PROCESSO_BOJO, referencia) : null;' corponu-sutia-completo-calculo-base-174.js

      - name: Gravar alteração
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name '99eliel'
          git config user.email '131190282+99eliel@users.noreply.github.com'
          git add corponu-sutia-completo-calculo-base-174.js corponu-sutia-completo-calculo.js update.js corponu-atualizador.js index.html corponu-release.json version.json
          git commit -m 'feat: configurar desconto padrão do bojo no Sutiã Completo 267'
          git push origin HEAD:main
