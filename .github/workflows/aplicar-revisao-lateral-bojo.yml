name: Publicar revisão lateral e bojo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aplicar-revisao-lateral-bojo.yml

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar módulo da revisão
        shell: bash
        run: |
          cat > /tmp/revisao.b64 <<'B64'

B64
          base64 -d /tmp/revisao.b64 | gzip -d > corponu-revisao-lateral-bojo.js

      - name: Atualizar página, versão e regras
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          antiga = "2026-07-30-rastreamento-enviar-manejo-17"
          nova = "2026-07-30-revisao-lateral-bojo-18"

          index = Path("index.html")
          texto = index.read_text(encoding="utf-8").replace(antiga, nova)
          script = f'  <script src="./corponu-revisao-lateral-bojo.js?v={nova}"></script>\n'
          if "corponu-revisao-lateral-bojo.js" not in texto:
              alvo = f'  <script src="./corponu-necessidade-livre.js?v={nova}"></script>\n'
              texto = texto.replace(alvo, script + alvo)
          index.write_text(texto, encoding="utf-8")

          atualizador = Path("corponu-atualizador.js")
          if atualizador.exists():
              atualizador.write_text(
                  atualizador.read_text(encoding="utf-8").replace(antiga, nova),
                  encoding="utf-8"
              )

          release = {
              "version": nova,
              "updatedAt": "2026-07-30T12:27:00-03:00",
              "notes": "Cria a área Revisão lateral e bojo. A OP pode registrar lateral e bojo feitos pela confecção, com descontos configuráveis e cumulativos nos processos SUTIÃ MONTAGEM e SUTIÃ COMPLETO. Somente pagamentos pendentes são recalculados."
          }
          Path("corponu-release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          regras = Path("firestore-rules.txt")
          r = regras.read_text(encoding="utf-8")
          if "alteracaoRevisaoComponentesPermitida" not in r:
              helper = r'''
    function pagamentoProcessoRevisaoSutia() {
      return (
        resource.data.keys().hasAny(["processo"])
        && resource.data.processo in ["SUTIÃ MONTAGEM", "SUTIA MONTAGEM", "SUTIÃ COMPLETO", "SUTIA COMPLETO"]
      ) || (
        resource.data.keys().hasAny(["servicoNome"])
        && resource.data.servicoNome in ["SUTIÃ MONTAGEM", "SUTIA MONTAGEM", "SUTIÃ COMPLETO", "SUTIA COMPLETO"]
      ) || (
        resource.data.keys().hasAny(["processoMovimentacao"])
        && resource.data.processoMovimentacao in ["SUTIÃ MONTAGEM", "SUTIA MONTAGEM", "SUTIÃ COMPLETO", "SUTIA COMPLETO"]
      );
    }

    function alteracaoRevisaoComponentesPermitida() {
      return usuarioComum()
        && pagamentoProcessoRevisaoSutia()
        && resource.data.statusPagamento != "pago"
        && request.resource.data.statusPagamento == resource.data.statusPagamento
        && request.resource.data.atualizadoPor == request.auth.uid
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly([
          "valorUnitario",
          "subtotal",
          "total",
          "valorUnitarioBaseRevisao",
          "valorTotalBaseRevisao",
          "revisaoComponentesAplicada",
          "revisaoLateralAtiva",
          "revisaoBojoAtiva",
          "descontoRevisaoLateralUnitario",
          "descontoRevisaoBojoUnitario",
          "descontoRevisaoComponentesUnitario",
          "descontoRevisaoComponentesTotal",
          "revisaoComponentesTotalCalculado",
          "revisaoComponentesValorUnitarioCalculado",
          "revisaoComponentesVersao",
          "revisaoComponentesAtualizadaEm",
          "atualizadoPor",
          "atualizadoEm"
        ]);
    }

'''
              r = r.replace("    function pagamentoDoUsuario() {", helper + "    function pagamentoDoUsuario() {")
              r = r.replace(
                  "        || alteracaoPagamentoAlcaPermitida()\n        || (",
                  "        || alteracaoPagamentoAlcaPermitida()\n        || alteracaoRevisaoComponentesPermitida()\n        || ("
              )
              regras.write_text(r, encoding="utf-8")
          PY

      - name: Validar arquivos
        shell: bash
        run: |
          node --check corponu-revisao-lateral-bojo.js
          node --check corponu-atualizador.js
          python -m json.tool corponu-release.json > /dev/null
          grep -q "corponu-revisao-lateral-bojo.js" index.html
          grep -q "alteracaoRevisaoComponentesPermitida" firestore-rules.txt
          grep -q "2026-07-30-revisao-lateral-bojo-18" index.html
          git diff --check

      - name: Publicar alterações
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Arquivos já publicados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html corponu-atualizador.js corponu-release.json firestore-rules.txt corponu-revisao-lateral-bojo.js
          git commit -m "feat: criar revisão lateral e bojo"
          git push origin main
