name: Publicar fases Calcinha 292

on:
  push:
    paths:
      - '.github/workflows/publicar-fases-calcinha-292.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Aplicar correção validada no teste
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/99eliel/corpunuteste/dc1f564fcaddc7a40068ff02548ec9799dc7c409/scripts/corrigir-fases-calcinha-292.py' -o /tmp/corrigir-fases-calcinha-292.py
          python3 /tmp/corrigir-fases-calcinha-292.py

      - name: Preparar release 292
        run: |
          node <<'NODE'
          const fs = require('fs');
          const OLD = '2026-09-09-fases-restritas-admin-291';
          const NEW = '2026-09-09-fases-calcinha-limpas-292';
          const notes = 'Produção. Corrige estruturalmente as sugestões de Fase Calcinha: remove a mistura histórica de sugestões globais/Sutiã, reconstrói uma única vez a lista da Calcinha usando apenas fases realmente registradas em OPs de Calcinha e ações explícitas do administrador, e passa a manter exclusões persistentes no documento configuracoes/fasesManejoCalcinha. OPs antigas não são alteradas. A recuperação manual passa a respeitar exclusões persistentes também na Calcinha.';

          for (const arquivo of ['update.js', 'index.html', 'corponu-atualizador.js']) {
            let texto = fs.readFileSync(arquivo, 'utf8');
            if (!texto.includes(OLD)) throw new Error(`${arquivo}: release 291 não encontrada`);
            texto = texto.split(OLD).join(NEW);
            fs.writeFileSync(arquivo, texto, 'utf8');
          }

          for (const arquivo of ['version.json', 'corponu-release.json']) {
            const obj = JSON.parse(fs.readFileSync(arquivo, 'utf8'));
            if (obj.version !== OLD) throw new Error(`${arquivo}: versão inesperada ${obj.version}`);
            obj.version = NEW;
            obj.updatedAt = '2026-09-09T10:18:00-03:00';
            obj.notes = notes;
            fs.writeFileSync(arquivo, JSON.stringify(obj, null, 2) + '\n', 'utf8');
          }
          NODE

      - name: Validar sintaxe e invariantes
        run: |
          set -euo pipefail
          node --check update.js
          node --check corponu-atualizador.js
          node -e "JSON.parse(require('fs').readFileSync('version.json','utf8')); JSON.parse(require('fs').readFileSync('corponu-release.json','utf8'));"
          grep -F 'CAMPO_FASES_CALCINHA_EXCLUIDAS' update.js
          grep -F 'MARCADOR_RECONSTRUCAO_FASES_CALCINHA' update.js
          grep -F 'alterarSugestaoFaseCalcinhaPersistente' update.js
          grep -F 'reconstruirListaFasesCalcinhaSeNecessario' update.js
          grep -F 'firestore.where("tipoAlvo", "==", "Sugestão de fase da Calcinha")' update.js
          grep -F 'await alterarSugestaoFaseCalcinhaPersistente(fase, "adicionar")' update.js
          grep -F 'await alterarSugestaoFaseCalcinhaPersistente(fase, "remover")' update.js
          grep -F 'await reconstruirListaFasesCalcinhaSeNecessario()' update.js
          grep -F 'adicionarFaseAoConjunto(calcinha, setores?.calcinha?.fase)' update.js
          grep -F 'adicionarFaseAoConjunto(calcinha, dados?.manejoCalcinha?.fase)' update.js
          grep -F 'adicionarFaseAoConjunto(calcinha, dados?.faseCalcinha)' update.js
          ! grep -F 'const exclusoesPersistentes = documentoId === FASES_CONFIG_DOCUMENTO' update.js
          ! grep -F 'servicePaymentHold' index.html
          ! grep -F 'data-service-hold="payment"' index.html
          grep -F '2026-09-09-fases-calcinha-limpas-292' update.js
          grep -F '2026-09-09-fases-calcinha-limpas-292' index.html
          grep -F '2026-09-09-fases-calcinha-limpas-292' corponu-atualizador.js
          git diff --check

      - name: Garantir escopo
        run: |
          arquivos="$(git diff --name-only | sort)"
          esperado="$(printf '%s\n' corponu-atualizador.js corponu-release.json index.html update.js version.json | sort)"
          test "$arquivos" = "$esperado"

      - name: Publicar release 292
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corponu-atualizador.js corponu-release.json index.html update.js version.json
          git commit -m 'fix: limpar e persistir fases da Calcinha 292'
          git push origin HEAD:main
