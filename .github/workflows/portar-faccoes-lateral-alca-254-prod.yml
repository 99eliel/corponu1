name: Portar Faccoes Lateral Alca 254 Prod

on:
  push:
    branches:
      - refactor/faccoes-lateral-alca-254-prod
    paths:
      - .github/workflows/portar-faccoes-lateral-alca-254-prod.yml

permissions:
  contents: write

jobs:
  portar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout producao
        uses: actions/checkout@v4
        with:
          ref: refactor/faccoes-lateral-alca-254-prod
          fetch-depth: 0

      - name: Buscar fonte homologada
        run: |
          git clone --depth 1 --branch refactor/faccoes-lateral-alca-254 https://github.com/99eliel/corpunuteste.git /tmp/corpunuteste
          cp /tmp/corpunuteste/corponu-faccoes-lateral-alca-254.js ./corponu-faccoes-lateral-alca-254.js
          cp /tmp/corpunuteste/corponu-faccoes-grupos-processos.js ./corponu-faccoes-grupos-processos.js
          cp /tmp/corpunuteste/corponu-faccoes-tres-abas-saida.js ./corponu-faccoes-tres-abas-saida.js

      - name: Integrar ao loader de producao sem mexer na Calcinha 253
        shell: python
        run: |
          from pathlib import Path
          import json, re

          updater = Path('corponu-atualizador.js')
          text = updater.read_text(encoding='utf-8')

          old_release = 'const LOCAL_RELEASE = "2026-08-25-manejo-calcinha-filtros-253";'
          new_release = 'const LOCAL_RELEASE = "2026-08-26-faccoes-lateral-alca-254-prod";'
          if old_release not in text:
              raise SystemExit('Release 253 esperada não encontrada no atualizador')
          text = text.replace(old_release, new_release, 1)

          antigos = [
              'corponu-faccoes-corte.js',
              'corponu-faccoes-grupos-processos-integracao.js',
              'corponu-faccoes-grupos-saida-fix.js',
              'corponu-faccoes-label-lateral.js',
              'corponu-faccoes-lateral-alca-integracao.js',
              'corponu-faccoes-lateral-alca-exclusao.js',
              'corponu-faccoes-ocultar-registrar-chegada-topo.js',
          ]
          for nome in antigos:
              pattern = rf'^\s*\["{re.escape(nome)}"[^\n]*\],\n'
              text, count = re.subn(pattern, '', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Módulo legado esperado não encontrado no loader: {nome}')

          anchor = '      ["corponu-chegada-manual-visual.js", "chegada-manual-visual", "Não foi possível carregar a aparência da chegada manual."],\n'
          novos = (
              '      ["corponu-faccoes-lateral-alca-254.js", "faccoes-lateral-alca-254", "Não foi possível carregar a área nativa de Lateral e Alça."],\n'
              '      ["corponu-faccoes-tres-abas-saida.js", "faccoes-tres-abas-saida", "Não foi possível carregar as abas de Facções."],\n'
          )
          if anchor not in text:
              raise SystemExit('Âncora de Facções não encontrada no loader')
          if 'corponu-faccoes-lateral-alca-254.js' in text:
              raise SystemExit('Módulo 254 já estava no loader antes da integração')
          text = text.replace(anchor, anchor + novos, 1)

          if 'corponu-manejo-calcinha-dedicado-253.js' not in text:
              raise SystemExit('Proteção: Calcinha 253 saiu do loader')
          if 'corponu-faccoes-exclusao-pagamento-vinculado.js' not in text:
              raise SystemExit('Proteção: vínculo de exclusão/pagamento saiu do loader')
          updater.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          velho = '<script src="./corponu-atualizador.js?v=2026-07-30-rastreamento-enviar-manejo-17"></script>'
          novo = '<script src="./corponu-atualizador.js?v=2026-08-26-faccoes-lateral-alca-254-prod"></script>'
          if velho not in html:
              raise SystemExit('Tag do atualizador esperada não encontrada no index.html')
          html = html.replace(velho, novo, 1)
          index.write_text(html, encoding='utf-8')

          release = Path('corponu-release.json')
          data = json.loads(release.read_text(encoding='utf-8'))
          data['version'] = '2026-08-26-faccoes-lateral-alca-254-prod'
          data['updatedAt'] = '2026-08-26T09:10:00-03:00'
          data['notes'] = (
              'PRODUÇÃO CONTROLADA. Limpeza estrutural de Facções > Lateral e Alça baseada no corpunuteste. '
              'Um único módulo nativo passa a controlar saída, andamento, chegada e pagamento de LATERAL/ALÇA. '
              'Os loaders/hotfixes antigos de Corte, integração, rótulo e exclusão de Lateral/Alça deixam de ser carregados. '
              'Facções e processos usam a fonte consolidada de grupos. LATERAL mantém pagamento por referência e ALÇA mantém quantidade recebida x 2 x valor padrão. '
              'Campos legados são preservados para compatibilidade com históricos. Calcinha 253, app.js, update.js e regras Firebase não foram alterados. '
              'Backup de retorno: backup/pre-faccoes-lateral-alca-254-prod.'
          )
          release.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Validar estrutura financeira e ausência dos remendos
        run: |
          node --check corponu-faccoes-lateral-alca-254.js
          node --check corponu-faccoes-grupos-processos.js
          node --check corponu-faccoes-tres-abas-saida.js
          node --check corponu-atualizador.js
          grep -q 'quantidade_recebida_x_valor_referencia' corponu-faccoes-lateral-alca-254.js
          grep -q 'quantidade_recebida_x_2_x_valor_alca' corponu-faccoes-lateral-alca-254.js
          grep -q 'if (pagamentoPago(current))' corponu-faccoes-lateral-alca-254.js
          grep -q 'const paymentId = `corte-${slug(movement.id)}`' corponu-faccoes-lateral-alca-254.js
          grep -q 'listarFaccoesPorProcesso' corponu-faccoes-grupos-processos.js
          grep -q 'corponu-manejo-calcinha-dedicado-253.js' corponu-atualizador.js
          grep -q 'corponu-faccoes-exclusao-pagamento-vinculado.js' corponu-atualizador.js
          grep -q 'corponu-faccoes-lateral-alca-254.js' corponu-atualizador.js
          ! grep -q 'corponu-faccoes-corte.js' corponu-atualizador.js
          ! grep -q 'corponu-faccoes-label-lateral.js' corponu-atualizador.js
          ! grep -q 'corponu-faccoes-lateral-alca-integracao.js' corponu-atualizador.js
          ! grep -q 'corponu-faccoes-lateral-alca-exclusao.js' corponu-atualizador.js
          git diff --check

      - name: Conferir diff permitido
        shell: python
        run: |
          import subprocess
          permitidos = {
              'corponu-faccoes-lateral-alca-254.js',
              'corponu-faccoes-grupos-processos.js',
              'corponu-faccoes-tres-abas-saida.js',
              'corponu-atualizador.js',
              'corponu-release.json',
              'index.html',
          }
          rastreados = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          novos = set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          arquivos = rastreados | novos
          extras = arquivos - permitidos
          if extras:
              raise SystemExit('Arquivos inesperados alterados: ' + ', '.join(sorted(extras)))
          faltando = {'corponu-faccoes-lateral-alca-254.js','corponu-atualizador.js'} - arquivos
          if faltando:
              raise SystemExit('Arquivos esperados sem alteração: ' + ', '.join(sorted(faltando)))
          print('Diff controlado:', ', '.join(sorted(arquivos)))

      - name: Commitar versão candidata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corponu-faccoes-lateral-alca-254.js corponu-faccoes-grupos-processos.js corponu-faccoes-tres-abas-saida.js corponu-atualizador.js corponu-release.json index.html
          git commit -m "refactor: Faccoes Lateral e Alca nativo 254 prod"
          git push origin HEAD:refactor/faccoes-lateral-alca-254-prod
