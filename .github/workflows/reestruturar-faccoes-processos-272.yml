name: Reestruturar Facções e Processos 272

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reestruturar-faccoes-processos-272.yml'

permissions:
  contents: write

jobs:
  reestruturar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar reestruturação
        run: node scripts/reestruturar-faccoes-processos-272.js

      - name: Validar JavaScript
        run: |
          node --check corponu-dual-mode.js
          node --check corponu-faccoes-tres-abas-saida.js
          node --check corponu-faccoes-lateral-alca-v2-270.js
          node --check corponu-processos-somente-valores.js
          node --check corponu-processos-valores-lateral-alca-272.js
          node --check corponu-atualizador.js
          node --check update.js

      - name: Validar JSON e arquitetura
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"
          ! grep -q 'id="abaFaccaoCorte"' index.html
          ! grep -q 'id="painelFaccoesCorte"' index.html
          ! grep -q 'id="processosValoresLateralAlca"' index.html
          grep -q 'id="abaFaccaoCorte"' corponu-dual-mode.js
          grep -q 'painel.id = "painelFaccoesCorte"' corponu-faccoes-lateral-alca-v2-270.js
          grep -q 'PAINEL_ID = "processosValoresLateralAlca"' corponu-processos-valores-lateral-alca-272.js
          grep -q 'corponu-processos-valores-lateral-alca-272.js' corponu-atualizador.js
          grep -q 'style.css?v=2026-08-31-faccoes-processos-estavel-272' index.html
          ! grep -q 'cloneNode' corponu-faccoes-tres-abas-saida.js
          grep -q '2026-08-31-faccoes-processos-estavel-272' corponu-release.json

      - name: Conferir diff
        run: git diff --check && git diff --stat

      - name: Publicar alteração funcional
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "99eliel"
          git config user.email "131190282+99eliel@users.noreply.github.com"
          git add index.html style.css corponu-dual-mode.js corponu-faccoes-tres-abas-saida.js corponu-faccoes-lateral-alca-v2-270.js corponu-processos-somente-valores.js corponu-processos-valores-lateral-alca-272.js corponu-atualizador.js update.js corponu-release.json version.json
          git diff --cached --quiet && { echo 'Nenhuma alteração funcional para publicar.'; exit 1; }
          git commit -m "refactor: estabilizar Facções e Valores de Lateral Alça 272"
          git push origin HEAD:main
