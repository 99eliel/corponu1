name: Limpar Temporários Facções 285

on:
  push:
    paths:
      - '.github/workflows/limpar-temporarios-faccoes-285.yml'

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remover artefatos temporários
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/organizar-faccoes-controlador-unificado-285.yml \
            .github/workflows/organizar-faccoes-controlador-unificado-285-v2.yml \
            .github/workflows/organizar-faccoes-controlador-unificado-285-v3.yml \
            .github/workflows/organizar-faccoes-controlador-unificado-285-v4.yml \
            .github/workflows/finalizar-faccoes-285.yml \
            .github/workflows/finalizar-faccoes-285-v2.yml \
            .github/workflows/limpar-temporarios-faccoes-285.yml \
            scripts/organizar-faccoes-controlador-unificado-285.js \
            scripts/organizar-faccoes-controlador-unificado-285.py \
            scripts/finalizar-faccoes-285.py \
            scripts/finalizar-faccoes-285-v2.py

      - name: Conferir que só temporários foram removidos
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f corponu-dual-mode.js
          test -f corponu-faccoes-tres-abas-saida.js
          test -f corponu-faccoes-lateral-alca-v2-270.js
          grep -F '2026-09-04-faccoes-controlador-unificado-285' corponu-release.json

      - name: Commitar limpeza
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'Nada para limpar.'; exit 1; }
          git commit -m 'chore: limpar temporários da reorganização Facções 285'
          git push origin HEAD:main
