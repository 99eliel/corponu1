name: Corrigir precos 186

on:
  push:
    branches:
      - main
    paths:
      - .fix-precos-confirmados-186

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .tmp-fix-precos-confirmados-186.py
      - run: node --check app.js
      - run: python -m json.tool corponu-release.json >/dev/null
      - run: grep -q 'Valor salvo e confirmado' app.js
      - run: grep -q 'app.js?v=2026-08-12-precos-confirmados-186' index.html
      - run: |
          git rm -f .github/workflows/fix-precos-confirmados-186.yml .fix-precos-confirmados-186 .tmp-fix-precos-confirmados-186.py
          git add app.js index.html corponu-release.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: confirmar e manter novos precos 186 [skip ci]"
          git push
