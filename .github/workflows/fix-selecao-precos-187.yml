name: Corrigir selecao de precos 187

on:
  push:
    branches:
      - main
    paths:
      - '.fix-selecao-precos-187'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar patch
        run: python tools/fix-selecao-precos-187.py

      - name: Validar
        run: |
          node --check app.js
          node --check update.js
          python -m json.tool version.json >/dev/null
          python -m json.tool corponu-release.json >/dev/null
          grep -q 'Nao foi possivel registrar o log do preco' app.js
          grep -q 'select.dataset.chaveSelecionada' app.js
          grep -q '2026-08-12-precos-selecao-estavel-187' update.js
          grep -q 'app.js?v=2026-08-12-precos-selecao-estavel-187' index.html

      - name: Publicar
        run: |
          git rm -f tools/fix-selecao-precos-187.py .github/workflows/fix-selecao-precos-187.yml .fix-selecao-precos-187
          git add app.js update.js index.html version.json corponu-release.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: manter processo selecionado ao salvar preco 187 [skip ci]"
          git push
