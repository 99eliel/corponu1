name: Aplicar relatório Facções 265

on:
  push:
    branches: [main]
    paths:
      - 'scripts/adicionar-relatorio-faccoes-265.js'
      - '.github/workflows/adicionar-relatorio-faccoes-265.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar relatório filtrado
        run: node scripts/adicionar-relatorio-faccoes-265.js
      - name: Validar JavaScript
        run: |
          node --check app.js
          node --check update.js
          node --check corponu-atualizador.js
      - name: Validar JSON e pós-condições
        run: |
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"
          grep -q 'btnImprimirRelatorioFaccoes' index.html
          grep -q 'function imprimirRelatorioFaccoesFiltrado' app.js
          grep -q 'function filtrarMovimentacoesFaccoes' app.js
          grep -q 'respeitarAbaAtiva: true' app.js
          grep -q '2026-08-28-faccoes-relatorio-filtrado-265' corponu-release.json
      - name: Gravar alteração
        run: |
          git config user.name "99eliel"
          git config user.email "131190282+99eliel@users.noreply.github.com"
          git add app.js index.html update.js corponu-atualizador.js corponu-release.json version.json
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'feat: imprimir relatório filtrado de facções 265'
          git push
