name: Aplicar Manejo Calcinha Dedicado 252 Produção

on:
  push:
    branches:
      - feature/manejo-calcinha-dedicado-252-prod
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: feature/manejo-calcinha-dedicado-252-prod

      - name: Trazer módulos validados da homologação
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/99eliel/corpunuteste/26de9818ea2d251e4c0954e391884776301c0f19"
          curl -fsSL "$BASE/corponu-manejo-calcinha-dedicado-252.js" -o corponu-manejo-calcinha-dedicado-252.js
          curl -fsSL "$BASE/corponu-dual-ready-bridge.js" -o corponu-dual-ready-bridge.js

      - name: Aplicar patch isolado
        run: python3 .github/scripts/aplicar-manejo-calcinha-252.py

      - name: Validar arquitetura
        shell: bash
        run: |
          set -euo pipefail
          node --check corponu-manejo-calcinha-dedicado-252.js
          node --check corponu-dual-ready-bridge.js
          node --check corponu-dual-mode.js
          node --check corponu-atualizador.js
          python3 -m json.tool corponu-release.json >/dev/null
          grep -F 'corponu-manejo-calcinha-dedicado-252.js' corponu-atualizador.js
          grep -F 'corponu-dual-ready-bridge.js' corponu-atualizador.js
          if grep -F 'corponu-manejo-calcinha-estavel-204.js' corponu-atualizador.js; then exit 1; fi
          if grep -F 'corponu-manejo-calcinha-fase-definitivo-216.js' corponu-atualizador.js; then exit 1; fi
          if grep -F 'corponu-manejo-calcinha-antipisca-231.js' corponu-atualizador.js; then exit 1; fi
          if grep -F 'window.salvarManejoLinha =' corponu-manejo-calcinha-dedicado-252.js; then exit 1; fi
          if grep -F 'setInterval' corponu-manejo-calcinha-dedicado-252.js; then exit 1; fi
          test "$(git status --porcelain | grep -v '^?? .github/' | wc -l)" -eq 5

      - name: Commitar integração validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corponu-atualizador.js corponu-dual-mode.js corponu-dual-ready-bridge.js corponu-manejo-calcinha-dedicado-252.js corponu-release.json
          git commit -m 'feat: Manejo Calcinha dedicado 252 em produção'
          git push origin HEAD:feature/manejo-calcinha-dedicado-252-prod
