name: Publicar fases restritas 291

on:
  push:
    paths:
      - '.github/workflows/publicar-fases-restritas-291.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java para emulador Firestore
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validar sintaxe real das regras Firestore
        run: |
          npx --yes firebase-tools@14.17.0 emulators:exec --only firestore --project demo-corponu-291 "echo REGRAS_FIRESTORE_OK"

      - name: Aplicar correção estrutural já validada no teste
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/99eliel/corpunuteste/d9fedbd7ee68a4589ba94894ed1de22a300a19fd/scripts/restringir-fases-manejo-291.py' -o /tmp/restringir-fases-manejo-291.py
          python3 /tmp/restringir-fases-manejo-291.py

      - name: Publicar release 291
        run: |
          node <<'NODE'
          const fs = require('fs');
          const OLD = '2026-09-09-fases-sutia-persistentes-290';
          const NEW = '2026-09-09-fases-restritas-admin-291';
          const notes = 'Produção. Fases de Sutiã e Calcinha passam a ser seleção fechada pelas listas administradas na aba Usuários. O Manejo consulta configuracoes/fasesManejo e configuracoes/fasesManejoCalcinha, valida novamente no servidor antes de salvar, bipar ou movimentar e não permite criação local de fase pelo operador. Fases históricas fora da lista permanecem visíveis apenas como histórico e exigem nova seleção válida para alteração. Regras Firestore versionadas validam alterações de fase contra as listas oficiais e a coleção legada fasesManejo passa a ser administrada somente por admin.';

          for (const arquivo of ['update.js', 'index.html', 'corponu-atualizador.js']) {
            let texto = fs.readFileSync(arquivo, 'utf8');
            if (!texto.includes(OLD)) throw new Error(`${arquivo}: release 290 não encontrada`);
            texto = texto.split(OLD).join(NEW);
            fs.writeFileSync(arquivo, texto, 'utf8');
          }

          for (const arquivo of ['version.json', 'corponu-release.json']) {
            const obj = JSON.parse(fs.readFileSync(arquivo, 'utf8'));
            if (obj.version !== OLD) throw new Error(`${arquivo}: versão inesperada ${obj.version}`);
            obj.version = NEW;
            obj.updatedAt = '2026-09-09T10:05:00-03:00';
            obj.notes = notes;
            fs.writeFileSync(arquivo, JSON.stringify(obj, null, 2) + '\n', 'utf8');
          }
          NODE

      - name: Validar aplicação e regra de negócio
        run: |
          set -euo pipefail
          node --check app.js
          node --check update.js
          node --check corponu-atualizador.js
          node -e "JSON.parse(require('fs').readFileSync('version.json','utf8')); JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('firebase.json','utf8'));"

          grep -F 'projectId: "corponu-b4942"' app.js
          grep -F 'getDocFromServer' app.js
          grep -F 'FASES_MANEJO_ADMIN_POR_SETOR' app.js
          grep -F 'documento: "fasesManejo"' app.js
          grep -F 'documento: "fasesManejoCalcinha"' app.js
          grep -F 'renderCampoFaseManejoOficial(rowId, setor, manejo?.fase || "")' app.js
          grep -F 'validarFaseManejoOficialAntesDeGravar' app.js
          grep -F 'somenteServidor: true' app.js
          grep -F 'await validarFaseManejoOficialAntesDeGravar' app.js

          ! grep -F 'input id="${rowId}-fase"' app.js
          ! grep -F 'function adicionarFaseSugestao(ordemId)' app.js
          ! grep -F 'state.fasesManejoExtras' app.js

          grep -F 'faseDoSetorPermitida' firebase-rules.txt
          grep -F '"fasesManejoCalcinha"' firebase-rules.txt
          grep -F 'allow create: if admin() || (usuarioComum() && criacaoDeFasesManejoPermitida());' firebase-rules.txt
          grep -F 'allow update: if admin() || (usuarioComum() && alteracaoDeFasesManejoPermitida());' firebase-rules.txt
          grep -F 'allow create, update, delete: if admin();' firebase-rules.txt

          grep -F '2026-09-09-fases-restritas-admin-291' index.html
          grep -F '2026-09-09-fases-restritas-admin-291' update.js
          grep -F '2026-09-09-fases-restritas-admin-291' corponu-atualizador.js
          ! grep -F 'servicePaymentHold' index.html
          ! grep -F 'data-service-hold="payment"' index.html
          git diff --check

      - name: Garantir escopo da alteração funcional
        run: |
          arquivos="$(git diff --name-only | sort)"
          esperado="$(printf '%s\n' app.js corponu-atualizador.js corponu-release.json index.html update.js version.json | sort)"
          test "$arquivos" = "$esperado"

      - name: Commitar release 291
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js corponu-atualizador.js corponu-release.json index.html update.js version.json
          git commit -m 'fix: restringir fases de Sutia e Calcinha as listas do admin 291'
          git push origin HEAD:main
