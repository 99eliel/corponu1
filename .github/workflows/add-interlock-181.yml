name: Adicionar INTERLOCK 181
on:
  push:
    branches: [main]
    paths:
      - '.add-interlock-181'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar INTERLOCK global
        run: python .github/scripts/add_interlock_181.py
      - name: Validar JavaScript
        run: |
          node --check update.js
          node --check app.js
      - name: Publicar
        run: |
          git rm -f .github/workflows/add-interlock-181.yml .github/scripts/add_interlock_181.py .add-interlock-181 || true
          git add app.js update.js index.html corponu-release.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: adicionar processo INTERLOCK global 181 [skip ci]"
          git push
