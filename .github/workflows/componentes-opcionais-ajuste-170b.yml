name: Componentes opcionais ajuste 170b
on:
  push:
    branches: [main]
    paths: ['.componentes-opcionais-ajuste-170b']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar responsável e confirmação
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('corponu-sutia-completo-calculo.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('input.required = feitoPelaFaccao;','input.required = false;',1)
          s=s.replace('placeholder="Quem fez? Informe ao marcar como pronta"','placeholder="Quem fez? (opcional)"',1)
          s=s.replace('origem: valor === "faccao" ? "Feito pela facção na chegada do Sutiã Completo" : "Feito pela confecção",','origem: valor === "faccao" ? "Feito pela facção na chegada do Sutiã Completo" : valor === "confeccao" ? "Feito pela confecção" : "Origem ainda não informada",',1)
          a='''    if (dados.lateral.feitoPelaFaccao && !dados.lateral.responsavel && !informacaoDefinitiva(atual.contexto.lateral)) {\n      document.getElementById(`${prefixo}LateralResponsavel`)?.focus();\n      avisar("Informe quem fez a lateral.", "erro");\n      return null;\n    }\n'''
          b='''    if (dados.bojo.feitoPelaFaccao && !dados.bojo.responsavel && !informacaoDefinitiva(atual.contexto.bojo)) {\n      document.getElementById(`${prefixo}BojoResponsavel`)?.focus();\n      avisar("Informe quem fez o bojo.", "erro");\n      return null;\n    }\n'''
          s=s.replace(a,'',1).replace(b,'',1)
          old='''        `Lateral: ${dados.lateral.pronto ? (memoria.precoLateral ? `desconto ${moeda4(memoria.descontos.lateral)}` : "PRONTA, mas sem valor cadastrado") : "não pronta — sem desconto"}`,\n        `Bojo: ${dados.bojo.pronto ? (memoria.precoBojo ? `desconto ${moeda4(memoria.descontos.bojo)}` : "PRONTO, mas sem valor cadastrado") : "não pronto — sem desconto"}`,'''
          new='''        `Lateral: ${dados.lateral.indefinido ? "não informada — pagamento aguardará definição" : dados.lateral.descontar ? (memoria.precoLateral ? `feita pela confecção — desconto ${moeda4(memoria.descontos.lateral)}` : "feita pela confecção, mas sem valor cadastrado") : "feita pela facção — sem desconto"}`,\n        `Bojo: ${dados.bojo.indefinido ? "não informado — pagamento aguardará definição" : dados.bojo.descontar ? (memoria.precoBojo ? `feito pela confecção — desconto ${moeda4(memoria.descontos.bojo)}` : "feito pela confecção, mas sem valor cadastrado") : "feito pela facção — sem desconto"}`,'''
          if old not in s: raise SystemExit('confirmação não encontrada')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          Path('corponu-release.json').write_text(json.dumps({'version':'2026-08-11-componentes-opcionais-170b','updatedAt':'2026-08-11T08:56:00-03:00','notes':'Lateral e Bojo podem ficar como Não sei / não informado sem bloquear a chegada. O nome de quem fez também deixa de ser obrigatório. Quando a origem não for conhecida, a chegada é salva e o pagamento fica aguardando definição; não há suposição de desconto. Facção segue sem desconto e confecção com desconto.'},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validar
        run: |
          node --check corponu-sutia-completo-calculo.js
          grep -q 'Quem fez? (opcional)' corponu-sutia-completo-calculo.js
          grep -q 'pagamento aguardará definição' corponu-sutia-completo-calculo.js
      - name: Publicar
        run: |
          rm -f .componentes-opcionais-ajuste-170b .github/workflows/componentes-opcionais-ajuste-170b.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A && git commit -m 'release: tornar responsável opcional no Sutiã Completo 170b [skip ci]' && git push
