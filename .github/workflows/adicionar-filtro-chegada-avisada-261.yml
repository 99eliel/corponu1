name: Aplicar filtro chegada avisada Faccoes 261

on:
  push:
    branches: [main]
    paths:
      - 'scripts/adicionar-filtro-chegada-avisada-261.js'
      - '.github/workflows/adicionar-filtro-chegada-avisada-261.yml'

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aplicar filtro estrutural
        run: node scripts/adicionar-filtro-chegada-avisada-261.js

      - name: Validar JavaScript
        run: |
          node --check app.js
          node --check update.js
          node --check corponu-atualizador.js

      - name: Validar JSON e estrutura
        run: |
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"
          grep -q 'id="faccaoMovFiltroChegada"' index.html
          grep -q 'Avisada • aguardando baixa' index.html
          grep -q 'function situacaoChegadaFaccoes' app.js
          grep -q 'filtros.chegada && situacaoChegadaFaccoes(mov)' app.js
          grep -q 'avisadasAguardandoBaixa' app.js
          git diff --check

      - name: Gravar alteracao
        run: |
          git config user.name "99eliel"
          git config user.email "131190282+99eliel@users.noreply.github.com"
          git add app.js index.html update.js corponu-atualizador.js corponu-release.json version.json
          git diff --cached --quiet && { echo 'Nenhuma alteracao para gravar'; exit 1; }
          git commit -m "feat: filtrar chegadas avisadas aguardando baixa 261"
          git push
