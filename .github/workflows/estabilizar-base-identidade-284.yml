name: Estabilizar Base Corpo Nu Flow 284

on:
  push:
    paths:
      - '.github/workflows/estabilizar-base-identidade-284.yml'

permissions:
  contents: write

jobs:
  estabilizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar estabilizacao estrutural
        run: node scripts/estabilizar-base-identidade-284.js

      - name: Validar JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < corponu-faccoes-tres-abas-saida.js
          node --input-type=module --check < corponu-atualizador.js
          node --input-type=module --check < update.js

      - name: Validar identidade e JSON
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"
          grep -F '<title>Corpo Nu Flow</title>' index.html
          grep -F '<h1>Corpo Nu Flow</h1>' index.html
          grep -F 'Sistema Integrado de Gestão da Produção' index.html
          ! grep -F '<h1>OP Confecção</h1>' index.html
          grep -F 'b.id = "btnSaidaAbas";' corponu-faccoes-tres-abas-saida.js
          ! grep -F 'if (!x || !document.getElementById("abaFaccaoCorte")) return;' corponu-faccoes-tres-abas-saida.js
          grep -F '2026-09-04-base-corpo-nu-flow-estavel-284' corponu-release.json

      - name: Conferir diff
        run: git diff --check

      - name: Commitar alteracoes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html corponu-atualizador.js update.js corponu-release.json version.json
          git diff --cached --quiet && { echo 'Nenhuma alteracao para commit.'; exit 1; }
          git commit -m 'fix: estabilizar base Corpo Nu Flow 284'
          git push origin HEAD:main
