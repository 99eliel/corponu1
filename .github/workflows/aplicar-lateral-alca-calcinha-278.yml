name: Aplicar Lateral e Alça Calcinha 278

on:
  push:
    branches: [main]
    paths:
      - 'scripts/aplicar-lateral-alca-calcinha-278.js'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar alteração estrutural
        run: node scripts/aplicar-lateral-alca-calcinha-278.js
      - name: Validar JavaScript
        run: |
          node --check corponu-faccoes-lateral-alca-v2-270.js
          node --check update.js
          node --check corponu-atualizador.js
      - name: Validar JSON e pós-condições
        run: |
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"
          grep -q 'calcinha.*opPossuiAlca\|tipo === "calcinha"' corponu-faccoes-lateral-alca-v2-270.js
          grep -q 'CORTAGEM E MONTAGEM' corponu-faccoes-lateral-alca-v2-270.js
          if grep -q 'atende somente OP de Sutiã' corponu-faccoes-lateral-alca-v2-270.js; then echo 'Trava antiga ainda presente'; exit 1; fi
      - name: Commit funcional
        run: |
          if git diff --quiet; then echo 'Nenhuma alteração'; exit 1; fi
          git config user.name '99eliel'
          git config user.email '131190282+99eliel@users.noreply.github.com'
          git add corponu-faccoes-lateral-alca-v2-270.js corponu-release.json version.json update.js corponu-atualizador.js index.html
          git commit -m 'feat: permitir Calcinha com alça no fluxo Lateral e Alça 278'
          git push
