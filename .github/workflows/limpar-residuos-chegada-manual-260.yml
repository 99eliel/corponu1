name: Finalizar remoção chegada manual 260

on:
  push:
    paths:
      - 'scripts/limpar-residuos-chegada-manual-260.mjs'
      - '.github/workflows/limpar-residuos-chegada-manual-260.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalizar:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[limpar-chegada-manual-260]')
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Finalizar versão 260
        run: node scripts/limpar-residuos-chegada-manual-260.mjs

      - name: Validar JavaScript e JSON
        run: |
          node --check update.js
          node --check app.js
          node --check corponu-atualizador.js
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); console.log('JSON válido')"

      - name: Confirmar fluxo obrigatório
        shell: bash
        run: |
          ! grep -n -E 'ChegadaManual|chegadaManual|chegada_manual_faccao' update.js app.js index.html corponu-atualizador.js
          test ! -e corponu-chegada-manual-faccoes-processo-119-seguro.js
          test ! -e README-CHEGADA-MANUAL-FACCAO.txt
          test -e corponu-faccoes-tres-abas-saida.js
          grep -q 'corponu-faccoes-tres-abas-saida.js' corponu-atualizador.js
          grep -q 'function registrarChegadaMovimentacao' app.js
          grep -q '2026-08-26-faccoes-sem-chegada-manual-260' update.js
          grep -q '2026-08-26-faccoes-sem-chegada-manual-260' corponu-atualizador.js
          grep -q 'update.js?v=2026-08-26-faccoes-sem-chegada-manual-260' index.html
          grep -q 'app.js?v=2026-08-26-faccoes-sem-chegada-manual-260' index.html

      - name: Gravar release e remover ferramentas temporárias
        shell: bash
        run: |
          git config user.name "99eliel"
          git config user.email "131190282+99eliel@users.noreply.github.com"
          git rm scripts/limpar-residuos-chegada-manual-260.mjs .github/workflows/limpar-residuos-chegada-manual-260.yml
          git add update.js index.html corponu-atualizador.js corponu-release.json
          git commit -m "release: remover chegada manual definitivamente 260"
          git push
