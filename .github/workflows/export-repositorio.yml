name: Exportar repositório para organização

on:
  push:
    branches:
      - maintenance/export-organizacao-20260730

permissions:
  contents: read

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Gerar ZIP do estado atual
        shell: bash
        run: |
          mkdir -p pacote/corponu1
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/export-repositorio.yml' \
            ./ pacote/corponu1/
          cd pacote
          zip -r ../corponu1-original.zip corponu1

      - name: Publicar pacote temporário
        uses: actions/upload-artifact@v4
        with:
          name: corponu1-original
          path: corponu1-original.zip
          retention-days: 1
          if-no-files-found: error
