name: Corrigir layout Manejo Calcinha 184

on:
  push:
    branches:
      - main
    paths:
      - '.fix-layout-calcinha-184'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar correcao isolada
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('style.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* TESTE 163 - Fase Bojo + Fase Lateral integradas ao Manejo Sutia. */'
          if marker not in s:
              raise SystemExit('Bloco de layout do Manejo Sutia nao encontrado')

          old = '#manejo .manejo-inline-table.manejo-limpo-table'
          new = '#manejo .manejo-inline-table.manejo-limpo-table.manejo-sutia-ativo'
          before, after = s.split(marker, 1)
          quantidade = after.count(old)
          if quantidade < 5:
              raise SystemExit(f'Quantidade inesperada de seletores do layout Sutia: {quantidade}')
          after = after.replace(old, new)
          s = before + marker + after
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          antigo = 'style.css?v=2026-08-10-fase-lateral-manejo-164'
          novo = 'style.css?v=2026-08-12-layout-calcinha-184'
          if antigo not in html:
              raise SystemExit('Versao atual do style.css nao encontrada no index')
          html = html.replace(antigo, novo, 1)
          p.write_text(html, encoding='utf-8')

          Path('corponu-release.json').write_text(json.dumps({
              'version': '2026-08-12-layout-calcinha-184',
              'updatedAt': '2026-08-12T14:58:00-03:00',
              'notes': 'Corrige somente o layout do Manejo Calcinha: as larguras compactas criadas para Fase Bojo e Fase Lateral passam a valer exclusivamente no Manejo Sutia. A Calcinha volta ao comportamento responsivo anterior. Nenhuma logica, filtro, salvamento ou dado foi alterado.'
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Validacao estrutural: no bloco 163 nao pode restar seletor amplo sem o escopo Sutia.
          css = Path('style.css').read_text(encoding='utf-8')
          trecho = css.split(marker, 1)[1]
          padrao = re.compile(re.escape(old) + r'(?!\.manejo-sutia-ativo)')
          if padrao.search(trecho):
              raise SystemExit('Ainda existe regra do bloco Sutia atingindo Calcinha')
          if new not in trecho:
              raise SystemExit('Escopo Sutia nao foi aplicado')
          PY

      - name: Validar arquivos
        shell: bash
        run: |
          python -m json.tool corponu-release.json >/dev/null
          grep -q 'style.css?v=2026-08-12-layout-calcinha-184' index.html
          grep -q 'manejo-limpo-table.manejo-sutia-ativo' style.css

      - name: Publicar
        shell: bash
        run: |
          git rm -f .github/workflows/fix-layout-calcinha-184.yml .fix-layout-calcinha-184
          git add style.css index.html corponu-release.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: restaurar layout responsivo do Manejo Calcinha 184 [skip ci]"
          git push
