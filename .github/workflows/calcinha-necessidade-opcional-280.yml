name: Aplicar Calcinha necessidade opcional 280

on:
  push:
    branches: [main]
    paths:
      - 'tmp-calcinha-necessidade-opcional-280.js'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar regra canônica
        run: node tmp-calcinha-necessidade-opcional-280.js
      - name: Validar JavaScript
        run: |
          node --check corponu-dual-mode.js
          node --check update.js
          node --check corponu-atualizador.js
      - name: Validar JSON e pós-condições
        run: |
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"
          grep -q '2026-09-02-calcinha-necessidade-opcional-280' corponu-dual-mode.js
          grep -q 'intervaloNecessidadeOpcionalValido' corponu-dual-mode.js
          grep -q 'needText.required = obrigatoria' corponu-dual-mode.js
          grep -q 'const needText = needFreeText || parseNeedFromDates' corponu-dual-mode.js
          grep -q 'necessidadeManual: Boolean(needText)' corponu-dual-mode.js
          if grep -q 'Informe um intervalo de necessidade válido' corponu-dual-mode.js; then echo 'Validação obrigatória antiga ainda presente'; exit 1; fi
      - name: Commit funcional
        run: |
          if git diff --quiet; then echo 'Nenhuma alteração funcional'; exit 1; fi
          git config user.name '99eliel'
          git config user.email '131190282+99eliel@users.noreply.github.com'
          git add corponu-dual-mode.js corponu-release.json version.json update.js corponu-atualizador.js index.html
          git commit -m 'fix: tornar necessidade opcional na OP de Calcinha 280'
          git push
