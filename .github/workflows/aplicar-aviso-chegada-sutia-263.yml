name: Aplicar aviso chegada Sutiã 263

on:
  push:
    branches: [main]
    paths:
      - 'scripts/estruturar-aviso-chegada-sutia-263.js'
      - '.github/workflows/aplicar-aviso-chegada-sutia-263.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aplicar correção estrutural
        run: node scripts/estruturar-aviso-chegada-sutia-263.js

      - name: Validar JavaScript
        run: |
          node --check app.js
          node --check corponu-faccoes-tres-abas-saida.js
          node --check corponu-aviso-chegada-admin-130.js
          node --check update.js
          node --check corponu-atualizador.js

      - name: Validar JSON e pós-condições
        run: |
          node -e "JSON.parse(require('fs').readFileSync('corponu-release.json','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8'));"
          grep -F 'function aplicarAbaAtiva(a = aba)' corponu-faccoes-tres-abas-saida.js
          grep -F 'const mensagem = `Chegada avisada por ${nome}`;' app.js
          grep -F '2026-08-27-faccoes-aviso-chegada-sutia-estavel-263' corponu-release.json

      - name: Gravar alteração
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "99eliel"
          git config user.email "131190282+99eliel@users.noreply.github.com"
          git add app.js corponu-faccoes-tres-abas-saida.js index.html update.js corponu-atualizador.js corponu-release.json version.json
          git commit -m "fix: estabilizar aviso chegada por usuário no Sutiã 263"
          git push origin main
